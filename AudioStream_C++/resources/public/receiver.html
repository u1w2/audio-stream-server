<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>音频播放</title>
<script src="/webrtc-low-latency.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f; color: #e0e0e0;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .container { max-width: 420px; width: 100%; text-align: center; }
  h1 {
    font-size: 28px; font-weight: 700; margin-bottom: 4px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 24px; font-size: 13px; }

  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 20px; padding: 12px 18px;
    background: rgba(255,255,255,0.05); border-radius: 12px; font-size: 14px;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #555;
    flex-shrink: 0; transition: background 0.3s;
  }
  .status-dot.connecting { background: #fbbf24; animation: pulse 1s infinite; }
  .status-dot.connected { background: #4ade80; }
  .status-dot.playing { background: #22d3ee; box-shadow: 0 0 8px #22d3ee66; animation: pulse 1.5s infinite; }
  .status-dot.error { background: #ef4444; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

  .info-card {
    padding: 14px; border-radius: 10px;
    background: rgba(255,255,255,0.03); margin-bottom: 16px;
  }
  .info-card .label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  .info-card .value {
    font-size: 13px; color: #ccc; margin-top: 4px;
    font-family: ui-monospace, monospace; word-break: break-all;
  }

  .audio-meter {
    width: 100%; height: 40px; border-radius: 10px;
    background: rgba(255,255,255,0.03); overflow: hidden;
    position: relative; margin: 16px 0;
  }
  .audio-meter-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #4ade80, #22d3ee);
    border-radius: 10px; transition: width 0.15s;
  }
  .audio-meter-label {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 12px; color: #888; pointer-events: none;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 28px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; width: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.97); }
  .btn-rejoin { background: linear-gradient(135deg, #4ade80, #22d3ee); color: #0a0a0f; }
  .hidden { display: none !important; }

  .diag {
    margin-top: 16px; padding: 12px;
    background: rgba(0,0,0,0.3); border-radius: 8px;
    font-family: ui-monospace, monospace; font-size: 10px; color: #666;
    text-align: left; white-space: pre-wrap; max-height: 200px; overflow-y: auto;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 AudioStream</h1>
  <p class="subtitle" id="subtitle">电脑音频 → 手机实时收听</p>

  <div class="status-bar">
    <span class="status-dot connecting" id="dot"></span>
    <span id="statusText">正在连接…</span>
  </div>

  <div class="info-card" id="infoCard">
    <div class="label">房间码 / 设备 ID</div>
    <div class="value" id="devId">-</div>
  </div>

  <div class="audio-meter">
    <div class="audio-meter-fill" id="meterFill"></div>
    <div class="audio-meter-label" id="meterLabel">等待音频流…</div>
  </div>

  <button class="btn btn-rejoin hidden" id="btnRejoin" onclick="rejoin()">重新连接</button>
  <button class="btn btn-rejoin hidden" id="btnPlay" onclick="resumePlayback()">点击播放</button>

  <audio id="p2pAudio" playsinline webkit-playsinline style="display:none"></audio>

  <div class="diag" id="diag"></div>
</div>

<script>
(function() {
  'use strict';

  var pc = null, ws = null, code = '', receiverId = '';
  var audioCtx = null, analyserNode = null, meterInterval = null, joined = false;
  var sourceNode = null;
  var playbackMode = 'none';
  var pendingCandidates = [];
  var remoteStream = null;
  var useTurnPath = false;
  var currentJitterTarget = 20;
  var metricTimer = null;
  var metricTick = 0;
  var METRIC_POST_EVERY = 10; // 每 10 秒上报一次到发送端日志
  var lastEnergy = 0;
  var latencyLabelText = '';
  var lastConcealedSamples = 0;
  var lastPacketsLost = 0;
  var statsLossDelta = 0;
  var statsJitterMs = 0;
  var statsConcealedDelta = 0;
  var stableStatsWindows = 0;
  var latencyMode = 'stable';
  var statsRttMs = 0;
  var diagLines = [];

  var ICE_SERVERS = [
    { urls: 'stun:stun.qq.com:3478' },
    { urls: 'stun:stun.aliyun.com:3478' },
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:39.101.174.208:3478', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
    { urls: 'turn:39.101.174.208:3478?transport=tcp', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' }
  ];
  var STUN_ONLY = ICE_SERVERS.filter(function(s) { return String(s.urls).indexOf('stun:') === 0; });

  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');
  var devId = document.getElementById('devId');
  var meterFill = document.getElementById('meterFill');
  var meterLabel = document.getElementById('meterLabel');
  var btnRejoin = document.getElementById('btnRejoin');
  var btnPlay = document.getElementById('btnPlay');
  var p2pAudio = document.getElementById('p2pAudio');
  var diag = document.getElementById('diag');

  function diagLog(tag, detail) {
    var ts = new Date().toLocaleTimeString();
    var line = '[' + ts + '] ' + tag + (detail ? ' ' + detail : '');
    diagLines.push(line);
    if (diagLines.length > 50) diagLines.shift();
    diag.textContent = diagLines.join('\n');
    diag.scrollTop = diag.scrollHeight;
    console.log('[rx]', tag, detail || '');
  }

  function setStatus(cls, text) {
    dot.className = 'status-dot ' + cls;
    statusText.textContent = text;
    diagLog('STATUS', cls + ' - ' + text);
  }

  function postMetric(message) {
    try {
      fetch('/engine-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, message: '[receiver ' + (receiverId || '-') + '] ' + message })
      }).catch(function() {});
    } catch (_) {}
  }

  function tuneOpusSdp(sdp) {
    if (!sdp) return sdp;
    return sdp.replace(/a=fmtp:(\d+) ([^\r\n]+)/g, function(line, pt, params) {
      if (!sdp.includes('a=rtpmap:' + pt + ' opus/')) return line;
      var kept = params.split(';').filter(function(p) {
        var k = p.split('=')[0].toLowerCase();
        return ['minptime', 'ptime', 'maxplaybackrate'].indexOf(k) === -1;
      });
      kept.push('minptime=10', 'ptime=10', 'useinbandfec=1', 'maxplaybackrate=48000');
      if (!kept.some(function(p) { return /^stereo=/i.test(p); })) kept.push('stereo=1');
      return 'a=fmtp:' + pt + ' ' + kept.join(';');
    });
  }

  function startPlayback(stream) {
    stopMeter();
    remoteStream = stream;
    btnPlay.classList.add('hidden');
    // 播放始终走 <audio> 元素：Chromium 中远端 WebRTC 流若未挂到媒体元素，
    // WebAudio 拿到的是静音；iOS 上非手势创建的 AudioContext 也可能一直 suspended。
    // WebAudio 仅用于电平表，不接 destination。
    playbackMode = 'element';
    p2pAudio.srcObject = stream;
    p2pAudio.autoplay = true;
    p2pAudio.muted = false;
    p2pAudio.volume = 1;

    applyJitterTarget(currentJitterTarget);

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      sourceNode = audioCtx.createMediaStreamSource(stream);
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 256;
      sourceNode.connect(analyserNode);
    } catch (e) {
      diagLog('meter init err', e.message);
    }

    var data = new Uint8Array(analyserNode ? analyserNode.frequencyBinCount : 128);
    meterInterval = setInterval(function() {
      if (!analyserNode) return;
      analyserNode.getByteFrequencyData(data);
      var sum = 0;
      for (var i = 0; i < data.length; i++) sum += data[i];
      var avg = sum / data.length;
      lastEnergy = avg;
      meterFill.style.width = Math.min(100, Math.round(avg / 170 * 100)) + '%';
      meterLabel.textContent = avg > 3 ? latencyLabelText : '等待音频流…';
    }, 150);

    tryStartPlayback();
    startMetricLoop();
  }

  function resumeMeterContext() {
    if (audioCtx && audioCtx.state === 'suspended' && audioCtx.resume) {
      audioCtx.resume().catch(function() {});
    }
  }

  function tryStartPlayback() {
    var playPromise = p2pAudio.play();
    if (!playPromise || typeof playPromise.then !== 'function') {
      setStatus('playing', '正在播放 🎵');
      resumeMeterContext();
      return;
    }
    playPromise.then(function() {
      diagLog('AUDIO', 'element playing');
      setStatus('playing', '正在播放 🎵');
      resumeMeterContext();
    }).catch(function(err) {
      diagLog('AUDIO-ERR', err && err.message);
      setStatus('connected', '点击「播放」开始收听');
      btnPlay.classList.remove('hidden');
    });
  }

  window.resumePlayback = function() {
    btnPlay.classList.add('hidden');
    tryStartPlayback();
  };

  function stopMeter() {
    if (meterInterval) { clearInterval(meterInterval); meterInterval = null; }
    if (metricTimer) { clearInterval(metricTimer); metricTimer = null; }
    if (analyserNode) { try { analyserNode.disconnect(); } catch(_) {} analyserNode = null; }
    if (sourceNode) { try { sourceNode.disconnect(); } catch(_) {} sourceNode = null; }
    if (audioCtx && audioCtx.state !== 'closed') { audioCtx.close().catch(function(){}); audioCtx = null; }
    if (p2pAudio) {
      try { p2pAudio.pause(); } catch(_) {}
      p2pAudio.srcObject = null;
    }
    remoteStream = null;
    playbackMode = 'none';
    lastEnergy = 0;
    latencyLabelText = '';
    stableStatsWindows = 0;
    lastPacketsLost = 0;
    statsLossDelta = 0;
    statsJitterMs = 0;
    statsConcealedDelta = 0;
    lastConcealedSamples = 0;
    meterFill.style.width = '0%';
    meterLabel.textContent = '等待音频流…';
    btnPlay.classList.add('hidden');
  }

  function applyJitterTarget(target) {
    var minJ = latencyMode === '200ms' ? 12 : 16;
    var maxJ = latencyMode === '200ms' ? 22 : 30;
    currentJitterTarget = Math.max(minJ, Math.min(maxJ, target));
    try {
      if (pc && pc.getReceivers) {
        pc.getReceivers().forEach(function(r) {
          if (r.track && r.track.kind === 'audio' && 'jitterBufferTarget' in r) {
            r.jitterBufferTarget = currentJitterTarget;
          }
        });
      }
      if (window.WebRTCLowLatency && WebRTCLowLatency.applyPlayout && pc) {
        WebRTCLowLatency.applyPlayout(pc, currentJitterTarget);
      }
    } catch (_) {}
  }

  function collectReceiverStats() {
    if (!pc || typeof pc.getStats !== 'function') return Promise.resolve();
    return pc.getStats().then(function(report) {
      var packetsLost = null;
      var jitterSec = null;
      var concealedSamples = null;
      report.forEach(function(stat) {
        if (stat.type === 'inbound-rtp' && stat.kind === 'audio') {
          if (typeof stat.packetsLost === 'number') packetsLost = stat.packetsLost;
          if (typeof stat.jitter === 'number') jitterSec = stat.jitter;
          if (typeof stat.concealedSamples === 'number') concealedSamples = stat.concealedSamples;
        }
        if (stat.type === 'candidate-pair' && stat.state === 'succeeded' && typeof stat.currentRoundTripTime === 'number') {
          statsRttMs = Math.round(stat.currentRoundTripTime * 1000);
        }
      });
      if (packetsLost !== null) {
        statsLossDelta = Math.max(0, packetsLost - lastPacketsLost);
        lastPacketsLost = packetsLost;
      }
      if (jitterSec !== null) {
        statsJitterMs = Math.round(jitterSec * 1000);
      }
      if (concealedSamples !== null) {
        statsConcealedDelta = Math.max(0, concealedSamples - lastConcealedSamples);
        lastConcealedSamples = concealedSamples;
      }
    }).catch(function() {});
  }

  function adaptJitterByStats() {
    if (!pc || !remoteStream) return;
    var jitterUp = latencyMode === '200ms' ? 12 : 14;
    var downNeed = latencyMode === '200ms' ? 8 : 12;
    var downFloor = latencyMode === '200ms' ? 13 : 18;
    var downWindows = latencyMode === '200ms' ? 8 : 12;
    if (statsLossDelta > 0 || statsConcealedDelta > 0 || statsJitterMs > jitterUp) {
      applyJitterTarget(currentJitterTarget + 2);
      stableStatsWindows = 0;
      diagLog('JITTER', 'stats up to ' + currentJitterTarget + ' lossΔ=' + statsLossDelta + ' jitter=' + statsJitterMs);
      return;
    }
    if (statsLossDelta === 0 && statsConcealedDelta === 0 && statsJitterMs > 0 && statsJitterMs < downNeed && lastEnergy > (latencyMode === '200ms' ? 6 : 10)) {
      stableStatsWindows += 1;
      if (stableStatsWindows >= downWindows && currentJitterTarget > downFloor) {
        applyJitterTarget(currentJitterTarget - 1);
        stableStatsWindows = 0;
        diagLog('JITTER', 'stats down to ' + currentJitterTarget);
      }
    } else {
      stableStatsWindows = 0;
    }
  }

  // 仅接收端部分（抖动缓冲 + 网络单程 + 解码/输出），不含发送端采集与排队
  function estimateReceiverLatencyMs() {
    var oneWay = statsRttMs > 0 ? Math.round(statsRttMs / 2) : 0;
    return currentJitterTarget + statsJitterMs + 25 + oneWay;
  }

  function applyLatencyModeFromUrl() {
    var params = new URLSearchParams(location.search || '');
    var mode = (params.get('latencyMode') || '').toLowerCase();
    if (mode === '200ms' || mode === 'low200') {
      latencyMode = '200ms';
      currentJitterTarget = 14;
    } else {
      latencyMode = 'stable';
      currentJitterTarget = 20;
    }
  }

  function startMetricLoop() {
    if (metricTimer) return;
    metricTimer = setInterval(function() {
      var ice = pc ? pc.iceConnectionState : 'none';
      var conn = pc ? pc.connectionState : 'none';
      collectReceiverStats().finally(function() {
        var estMs = estimateReceiverLatencyMs();
        var msg =
          'metric mode=' + latencyMode +
          ' rxMs=' + estMs +
          ' jitter=' + currentJitterTarget +
          ' energy=' + Math.round(lastEnergy) +
          ' ice=' + ice +
          ' conn=' + conn +
          ' rtt=' + statsRttMs +
          ' statsJitter=' + statsJitterMs +
          ' lossΔ=' + statsLossDelta +
          ' concealΔ=' + statsConcealedDelta;
        diagLog('METRIC', msg);
        metricTick += 1;
        if (metricTick % METRIC_POST_EVERY === 0) postMetric(msg);
        if (remoteStream) {
          latencyLabelText = '接收端延时 ~' + estMs + 'ms（不含发送端）';
        }
        adaptJitterByStats();
      });
    }, 1000);
  }

  // ── WebSocket ──
  function connectWS() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = proto + '//' + location.host + '/?role=receiver';
    diagLog('WS-URL', url);
    ws = new WebSocket(url);

    ws.onopen = function() {
      diagLog('WS', 'connected');
      var params = new URLSearchParams(location.search);
      var nickname = params.get('nickname') || '听众';
      var joinMsg = { type: 'join', code: code, nickname: nickname, clientId: 'bc-' + randomHex(16), netType: 'wifi' };
      diagLog('SEND', 'join code=' + code + ' nick=' + nickname);
      ws.send(JSON.stringify(joinMsg));
      setStatus('connecting', '已连接，加入房间…');
    };

    ws.onmessage = function(e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch(_) { diagLog('PARSE-ERR', e.data.slice(0,60)); return; }
      diagLog('RECV', msg.type + (msg.receiverId ? ' rid=' + msg.receiverId.slice(-8) : '') + (msg.code ? ' code=' + msg.code : ''));
      handleMessage(msg);
    };

    ws.onclose = function(e) {
      diagLog('WS-CLOSE', 'code=' + e.code + ' reason=' + (e.reason || '') + ' wasClean=' + e.wasClean);
      if (joined) setStatus('error', '连接断开');
      btnRejoin.classList.remove('hidden');
    };

    ws.onerror = function(e) {
      diagLog('WS-ERROR', 'WebSocket error occurred');
    };
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case 'joined':
        receiverId = msg.receiverId;
        devId.textContent = receiverId;
        joined = true;
        diagLog('JOINED', 'rid=' + receiverId + ' code=' + (msg.code || code));
        setStatus('connected', '已加入房间，等待音频…');
        break;

      case 'webrtc-offer':
        diagLog('OFFER', msg.sdp ? ('sdp=' + (typeof msg.sdp === 'string' ? msg.sdp.slice(0, 30) : JSON.stringify(msg.sdp).slice(0, 60))) : 'NO SDP!');
        if (msg.sdp) {
          handleOffer(msg).catch(function(e) {
            diagLog('OFFER-FAIL', e.message || e);
            setStatus('error', '连接失败: ' + (e.message || ''));
          });
        } else {
          diagLog('OFFER-NO-SDP', 'offer msg has no sdp field');
          setStatus('error', '收到空 SDP');
        }
        break;

      case 'webrtc-ice':
        if (!msg.candidate) break;
        if (pc && pc.remoteDescription) {
          pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).then(function() {
            diagLog('ICE+', 'added');
          }).catch(function(e) {
            diagLog('ICE-ERR', e.message);
          });
        } else {
          pendingCandidates.push(msg.candidate);
          diagLog('ICE-Q', 'queued=' + pendingCandidates.length);
        }
        break;

      case 'peer-disconnected':
      case 'sender-disconnected':
        setStatus('error', '发送端已断开');
        cleanupPC();
        btnRejoin.classList.remove('hidden');
        break;

      case 'error':
        diagLog('SRV-ERR', msg.message || msg.code || '');
        setStatus('error', msg.message || '服务器错误');
        break;

      case 'session-replaced':
        setStatus('error', '会话被替换');
        break;

      default:
        diagLog('UNHANDLED', msg.type);
    }
  }

  function flushPendingCandidates() {
    if (!pc) return;
    var queued = pendingCandidates.slice();
    pendingCandidates = [];
    queued.forEach(function(c) {
      pc.addIceCandidate(new RTCIceCandidate(c)).catch(function(e) {
        diagLog('ICE-ERR', e.message);
      });
    });
    if (queued.length) diagLog('ICE-FLUSH', String(queued.length));
  }

  async function handleOffer(msg) {
    cleanupPC();
    pendingCandidates = [];
    useTurnPath = !!msg.useTURN;

    var iceServers = useTurnPath ? ICE_SERVERS : STUN_ONLY;
    var pcConfig = {
      iceServers: iceServers,
      bundlePolicy: 'max-bundle',
      rtcpMuxPolicy: 'require',
      iceCandidatePoolSize: 0
    };
    if (useTurnPath) pcConfig.iceTransportPolicy = 'relay';

    pc = new RTCPeerConnection(pcConfig);
    diagLog('PC', 'created turn=' + useTurnPath);

    pc.ontrack = function(e) {
      diagLog('TRACK', e.track.kind + ' label=' + e.track.label);
      if (e.track.kind !== 'audio') return;
      var stream = e.streams[0] || new MediaStream([e.track]);
      startPlayback(stream);
    };

    pc.onicecandidate = function(e) {
      if (e.candidate && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: 'webrtc-ice',
          receiverId: receiverId,
          candidate: e.candidate.toJSON()
        }));
        diagLog('ICE-SEND', e.candidate.candidate.slice(0, 40));
      }
    };

    pc.oniceconnectionstatechange = function() {
      diagLog('ICE-STATE', pc.iceConnectionState);
      if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
        setStatus('connected', '音频通道已连通');
        if (remoteStream && p2pAudio.paused) tryStartPlayback();
      }
      if (pc.iceConnectionState === 'failed') {
        if (!useTurnPath) {
          diagLog('ICE', 'direct failed, request TURN retry');
          useTurnPath = true;
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'request-turn', receiverId: receiverId }));
          }
        } else {
          setStatus('error', 'ICE 连接失败');
          btnRejoin.classList.remove('hidden');
        }
      }
    };

    pc.onconnectionstatechange = function() {
      diagLog('CONN-STATE', pc.connectionState);
      if (pc.connectionState === 'connected') diagLog('✓', 'WebRTC connected');
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        setStatus('error', 'WebRTC 断开');
        btnRejoin.classList.remove('hidden');
      }
    };

    var sdpObj = msg.sdp;
    if (typeof sdpObj === 'string') {
      try { sdpObj = JSON.parse(sdpObj); } catch(_) {}
    }
    if (!sdpObj || typeof sdpObj !== 'object') {
      throw new Error('SDP invalid: ' + JSON.stringify(sdpObj).slice(0, 80));
    }

    var remoteDesc = (typeof RTCSessionDescription !== 'undefined')
      ? new RTCSessionDescription(sdpObj)
      : sdpObj;
    if (remoteDesc.sdp) {
      remoteDesc = {
        type: remoteDesc.type || 'offer',
        sdp: tuneOpusSdp(remoteDesc.sdp)
      };
    }

    diagLog('SDP', 'type=' + remoteDesc.type + ' len=' + (remoteDesc.sdp ? remoteDesc.sdp.length : 0));

    await pc.setRemoteDescription(remoteDesc);
    flushPendingCandidates();
    diagLog('REMOTE-SET', 'ok');

    if (window.WebRTCLowLatency && WebRTCLowLatency.createAnswer) {
      await WebRTCLowLatency.createAnswer(pc);
    } else {
      var answer = await pc.createAnswer();
      answer.sdp = tuneOpusSdp(answer.sdp);
      await pc.setLocalDescription(answer);
    }
    diagLog('ANSWER', 'created and set');

    applyJitterTarget(currentJitterTarget);

    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-answer',
        receiverId: receiverId,
        sdp: pc.localDescription.toJSON()
      }));
      diagLog('ANSWER-SENT', 'ok');
    }
    setStatus('connected', '通道建立中…');
  }

  function cleanupPC() {
    if (pc) { try { pc.close(); } catch(_) {} pc = null; }
    pendingCandidates = [];
    stopMeter();
  }

  function randomHex(len) {
    var s = '';
    while (s.length < len) s += Math.random().toString(16).slice(2);
    return s.slice(0, len);
  }

  window.rejoin = function() {
    cleanupPC();
    if (ws) { try { ws.close(); } catch(_) {} }
    btnRejoin.classList.add('hidden');
    diagLines = [];
    diag.textContent = '';
    setStatus('connecting', '重新连接…');
    meterFill.style.width = '0%';
    meterLabel.textContent = '等待音频流…';
    connectWS();
  };

  // ── Init ──
  var params = new URLSearchParams(location.search);
  applyLatencyModeFromUrl();
  code = (params.get('code') || '').toUpperCase();
  if (!code) code = (location.hash.replace('#','') || '').toUpperCase();
  if (!code) {
    diagLog('ERR', 'no code in URL');
    setStatus('error', '未提供房间码');
    statusText.textContent = '请在 URL 后加上 ?code=XXXXX';
    return;
  }
  devId.textContent = '房间 ' + code;
  setStatus('connecting', '正在连接…');
  diagLog('INIT', 'code=' + code + ' host=' + location.host + ' mode=' + latencyMode);
  connectWS();
})();
</script>
</body>
