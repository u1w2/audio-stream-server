<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码连接 - 音频流</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    
    .logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 25px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    
    .subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 40px;
    }
    
    .qrcode-container {
      background: white;
      border-radius: 20px;
      padding: 25px;
      display: inline-block;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      margin-bottom: 30px;
    }
    
    #qrcode {
      width: 256px;
      height: 256px;
    }
    
    .url-display {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 20px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
    }
    
    .info-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
    }
    
    .info-box svg {
      width: 20px;
      height: 20px;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #667eea;
    }
    
    .stat-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 5px;
    }
    
    .btn-copy {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      margin-top: 10px;
    }
    
    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    
    .btn-copy:active {
      transform: scale(0.98);
    }
    
    .copy-success {
      color: #27ae60;
      font-size: 12px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .copy-success.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🔊</div>
    <h1>音频流服务</h1>
    <p class="subtitle">手机扫码连接，实时收听电脑声音</p>
    
    <div class="qrcode-container">
      <div id="qrcode"></div>
    </div>
    
    <div class="url-display" id="urlDisplay">加载中...</div>
    <button class="btn-copy" id="copyBtn">复制链接</button>
    <div class="copy-success" id="copySuccess">✓ 已复制到剪贴板</div>
    
    <div class="info-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20v-6m0 0l-3 3m3-3l3 3"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>确保手机和电脑在同一局域网</span>
    </div>
    
    <div class="info-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span>使用手机相机或扫码APP扫描</span>
    </div>
    
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="connectionCount">0</div>
        <div class="stat-label">在线连接</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="captureStatus">停止</div>
        <div class="stat-label">捕获状态</div>
      </div>
    </div>
  </div>

  <script>
    const qrcodeContainer = document.getElementById('qrcode');
    const urlDisplay = document.getElementById('urlDisplay');
    const copyBtn = document.getElementById('copyBtn');
    const copySuccess = document.getElementById('copySuccess');
    const connectionCount = document.getElementById('connectionCount');
    const captureStatus = document.getElementById('captureStatus');

    const currentUrl = window.location.href.replace('/scan', '');
    
    urlDisplay.textContent = currentUrl;

    function generateQRCode() {
      const canvas = document.createElement('canvas');
      canvas.id = 'qrcode-canvas';
      canvas.width = 256;
      canvas.height = 256;
      qrcodeContainer.innerHTML = '';
      qrcodeContainer.appendChild(canvas);
      
      drawQRCode(canvas, currentUrl);
    }

    function drawQRCode(canvas, text) {
      const ctx = canvas.getContext('2d');
      const size = 256;
      const moduleSize = 4;
      const margin = 16;
      
      const qr = qrcode(text, { typeNumber: 4, errorCorrectionLevel: 'L' });
      const modules = qr.modules;
      const count = modules.length;
      
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      
      ctx.fillStyle = '#000000';
      for (let row = 0; row < count; row++) {
        for (let col = 0; col < count; col++) {
          if (modules[row][col]) {
            ctx.fillRect(
              margin + col * moduleSize,
              margin + row * moduleSize,
              moduleSize,
              moduleSize
            );
          }
        }
      }
    }

    function qrcode(text, options) {
      const { typeNumber, errorCorrectionLevel } = options;
      const QRCode = require('qrcode');
      const qr = new QRCode(typeNumber, errorCorrectionLevel);
      qr.addData(text);
      qr.make();
      return qr;
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(currentUrl);
        copySuccess.classList.add('show');
        setTimeout(() => {
          copySuccess.classList.remove('show');
        }, 2000);
      } catch (err) {
        console.error('复制失败:', err);
      }
    });

    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProtocol}//${window.location.host}/ws?stats=true`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      console.log('WebSocket connected');
    };

    ws.onmessage = (event) => {
      if (typeof event.data === 'string') {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'stats') {
            connectionCount.textContent = data.connections;
            captureStatus.textContent = data.capturing ? '运行中' : '停止';
            captureStatus.style.color = data.capturing ? '#27ae60' : '#e74c3c';
          }
        } catch (e) {
          console.log('Binary data received');
        }
      }
    };

    ws.onerror = (error) => {
      console.error('WebSocket error:', error);
    };

    ws.onclose = () => {
      console.log('WebSocket closed');
    };

    generateQRCode();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</body>
</html>
