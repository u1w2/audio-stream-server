<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>音频播放</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f; color: #e0e0e0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .container { max-width: 400px; width: 100%; padding: 32px 24px; text-align: center; }
  h1 {
    font-size: 24px; font-weight: 700; margin-bottom: 6px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 28px; font-size: 13px; }
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 24px; padding: 10px 16px;
    background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 13px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #555; transition: background 0.3s;
  }
  .status-dot.connected { background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
  .status-dot.playing { background: #22d3ee; box-shadow: 0 0 6px #22d3ee66; animation: pulse 1.5s infinite; }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 6px #ef444466; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 28px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  .btn-connect { background: linear-gradient(135deg, #4ade80, #22d3ee); color: #0a0a0f; }
  .btn-connect:hover { opacity: 0.9; }
  .btn-connect:disabled { opacity: 0.4; cursor: not-allowed; }

  .br-toggle { display: flex; gap: 3px; justify-content: center; align-items: stretch; flex-wrap: nowrap; margin: 8px 0; }
  .br-toggle-item {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.03); color: #888; font-size: 8px; font-weight: 500;
    cursor: pointer; text-align: center; transition: all 0.15s; min-width: 0;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    user-select: none;
  }
  .br-toggle-item .br-tag { font-size: 10px; font-weight: 500; opacity: 0.7; }
  .br-toggle-item:active { transform: scale(0.95); }
  .br-toggle-item.active { background: rgba(74,222,128,0.15); color: #4ade80; border-color: #4ade8066; }
  .br-toggle-item.active .br-tag { opacity: 0.8; }
  .br-toggle-item.disabled { opacity: 0.25; pointer-events: none; }

  #playQrContainer {
    margin: 20px 0;
  }
  #playQrContainer img { border-radius: 12px; }

  .hidden { display: none !important; }

  .tip {
    margin-top: 24px; padding: 10px 14px;
    background: rgba(74, 222, 128, 0.08); border-left: 3px solid #4ade80;
    border-radius: 0 8px 8px 0; font-size: 12px; color: #8b9; text-align: left;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎧 Audio Stream</h1>
  <p class="subtitle">手机端播放</p>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">未连接</span>
  </div>

  <div id="actionArea"></div>

  <div id="playArea" class="hidden">
    <div id="playQrContainer">
      <div style="background:white; border-radius:12px; padding:12px; display:inline-block;">
        <img id="qrImage" style="width:160px;height:160px; display:block;" alt="QR">
      </div>
      <p style="color:#888; font-size:11px; margin-top:6px;">📱 让朋友扫码一起听</p>
    </div>
    <p style="color:#666; font-size:12px;" id="playHint">连接中...</p>
    <audio id="p2pAudio" autoplay playsinline style="display:none;"></audio>
    <div id="bitrateControl" class="hidden" style="margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06);">
      <label style="font-size:12px; color:#888; display:block; margin-bottom:6px;">音质</label>
      <div id="brToggle" class="br-toggle"></div>
    </div>
  </div>

  <div class="tip hidden">💡 点击按钮即可开始收听。请确保手机音量已打开。</div>
</div>

<script>
let ws = null;
let roomCode = null;
let isPlaying = false;
let myReceiverId = null;
let myNickname = null;
let myJoinToken = null;
let audioCtx = null;
let _wsReconnecting = false;

const SESSION_CLIENT_KEY = 'audio-stream-client-id';
const SESSION_RECEIVER_KEY = 'audio-stream-receiver-sessions';
const SESSION_TAB_KEY = 'audio-stream-receiver-tab';
const NICKNAME_RE = /^[\u4e00-\u9fa5a-zA-Z0-9]{1,16}$/;
/** 与服务端 RECEIVER_SLOT_TTL_MS 默认一致（24h） */
const RECEIVER_SLOT_TTL_MS = 24 * 60 * 60 * 1000;

function getOrCreateClientId() {
  let id = localStorage.getItem(SESSION_CLIENT_KEY);
  if (!id) {
    id = 'bc-' + crypto.randomUUID().replace(/-/g, '').slice(0, 16);
    localStorage.setItem(SESSION_CLIENT_KEY, id);
  }
  return id;
}

function loadReceiverSessions() {
  try {
    return JSON.parse(localStorage.getItem(SESSION_RECEIVER_KEY) || '{}');
  } catch (_) {
    return {};
  }
}

function saveReceiverSession(code, data) {
  const all = loadReceiverSessions();
  all[code] = { ...data, updatedAt: Date.now() };
  localStorage.setItem(SESSION_RECEIVER_KEY, JSON.stringify(all));
}

function getReceiverSession(code) {
  const entry = loadReceiverSessions()[code];
  if (!entry) return null;
  if (entry.updatedAt && Date.now() - entry.updatedAt > RECEIVER_SLOT_TTL_MS) {
    clearReceiverSession(code);
    return null;
  }
  return entry;
}

function clearReceiverSession(code) {
  const all = loadReceiverSessions();
  delete all[code];
  localStorage.setItem(SESSION_RECEIVER_KEY, JSON.stringify(all));
}

function saveTabSession(data) {
  try {
    sessionStorage.setItem(SESSION_TAB_KEY, JSON.stringify(data));
  } catch (_) {}
}

function getTabSession() {
  try {
    return JSON.parse(sessionStorage.getItem(SESSION_TAB_KEY) || 'null');
  } catch (_) {
    return null;
  }
}

function defaultNickname() {
  return String(Math.floor(100 + Math.random() * 900));
}

function validateNicknameInput(name) {
  const trimmed = (name || '').trim();
  return trimmed.length >= 1 && NICKNAME_RE.test(trimmed);
}

function getNicknameFromUI() {
  const el = document.getElementById('nicknameInput');
  return el ? el.value.trim() : defaultNickname();
}

function suggestedNicknameForRoom(code) {
  const stored = code ? getReceiverSession(code) : null;
  if (stored && stored.nickname && validateNicknameInput(stored.nickname)) {
    return stored.nickname;
  }
  return defaultNickname();
}

// WebRTC
let p2pPC = null;
let probePC = null;
let turnProbePC = null;
let p2pRemoteStream = null;
let probeRemoteStream = null;
let turnProbeRemoteStream = null;
let pendingCandidates = [];
let probePendingCandidates = [];
let turnProbePendingCandidates = [];
let _onTurn = false;
const ICE_SERVERS = [
  { urls: 'stun:stun.qq.com:3478' },
  { urls: 'stun:stun.aliyun.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'turn:39.101.174.208:3478', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
  { urls: 'turn:39.101.174.208:3478?transport=tcp', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
];
const STUN_SERVERS = [
  { urls: 'stun:stun.qq.com:3478' },
  { urls: 'stun:stun.aliyun.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
];

function logToServer(text, tag) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({
      type: 'client-log',
      role: 'receiver',
      text,
      tag: tag || '',
      receiverId: myReceiverId,
    }));
  }
  console.log('[Receiver] ' + text);
}

function sendLeave() {
  if (_wsReconnecting) return;
  if (ws && ws.readyState === WebSocket.OPEN && roomCode) {
    try { ws.send(JSON.stringify({ type: 'leave' })); } catch (_) {}
  }
}
// 刷新/关页仅触发 WS close，走服务端 grace 保留 slot；勿在此 sendLeave（会 removeSlot 导致刷新后会话已过期）

// Store code from URL
let pendingCode = null;
let _receiverDisconnectTimer = null;

function setTurnUI(on) {
  _onTurn = on;
  document.getElementById('bitrateControl').classList.toggle('hidden', on);
  if (on) {
    document.getElementById('playHint').textContent = 'TURN 中继（16kbps）';
    setStatus('playing', 'TURN 中继 📡');
  } else {
    document.getElementById('playHint').textContent = '正在播放';
    setStatus('playing', 'P2P 播放 🎵');
  }
}

function getNetworkHint() {
  const c = navigator.connection;
  if (!c) return {};
  return { netType: c.type || '', effectiveType: c.effectiveType || '' };
}

function notifyNetworkChanged() {
  if (!roomCode || !myReceiverId) return;
  if (isReceiverIceRestarting()) {
    logToServer('ICE restart 协商中，跳过 network-changed', 'network');
    return;
  }
  if (_networkChangeTimer) clearTimeout(_networkChangeTimer);
  _networkChangeTimer = setTimeout(() => {
    _networkChangeTimer = null;
    if (ws && ws.readyState === WebSocket.OPEN) {
      const hint = getNetworkHint();
      _lastNetworkChangedAt = Date.now();
      suppressConnectionLost(12000);
      logToServer('发送 network-changed netType=' + (hint.netType || '?'), 'network');
      ws.send(JSON.stringify({
        type: 'network-changed',
        receiverId: myReceiverId,
        ...hint,
      }));
      scheduleNetworkRecoveryWatchdog();
    }
  }, 200);
}

function scheduleNetworkRecoveryWatchdog() {
  if (_networkRecoveryTimer) clearTimeout(_networkRecoveryTimer);
  _networkRecoveryTimer = setTimeout(() => {
    _networkRecoveryTimer = null;
    const ice = p2pPC ? p2pPC.iceConnectionState : 'none';
    if (ice === 'connected' || ice === 'completed') return;
    logToServer('切网后 ICE 未恢复，自动 reconnectWebRTC ice=' + ice, 'recover');
    suppressConnectionLost(10000);
    stopMediaWatchdog();
    cleanupProbePC();
    cleanupTurnProbePC();
    closePCIntentionally();
    isPlaying = false;
    _reconnecting = false;
    _receiverIceRestartUntil = 0;
    document.getElementById('playHint').textContent = '重新连接...';
    setStatus('buffering', '重连中...');
    if (ws && ws.readyState === WebSocket.OPEN && roomCode) {
      ws.send(JSON.stringify(buildJoinMessage(roomCode, {
        replaceSession: false,
        nickname: myNickname,
        reconnectWebRTC: true,
      })));
    }
  }, 6000);
}

let _networkChangeTimer = null;
let _lastNetworkChangedAt = 0;
let _networkRecoveryTimer = null;
let _roomBroadcast = null;
let _suppressConnectionLostUntil = 0;
let _receiverIceRestartUntil = 0;

function isReceiverIceRestarting() {
  return _receiverIceRestartUntil > Date.now();
}

function suppressConnectionLost(ms) {
  _suppressConnectionLostUntil = Math.max(_suppressConnectionLostUntil, Date.now() + ms);
}

function setupRoomBroadcast(code) {
  if (!('BroadcastChannel' in window) || !code) return;
  if (_roomBroadcast) {
    try { _roomBroadcast.close(); } catch (_) {}
  }
  const ch = new BroadcastChannel('audio-stream-' + code);
  const myTs = Date.now();
  ch.postMessage({ type: 'takeover', ts: myTs });
  ch.onmessage = (e) => {
    if (e.data?.type === 'takeover' && e.data.ts > myTs) {
      logToServer('新标签页接管会话，本页 leave', 'session');
      sendLeave();
      closePCIntentionally();
      if (ws) {
        try { ws.close(); } catch (_) {}
      }
    }
  };
  _roomBroadcast = ch;
}

function notifyConnectionLost() {
  if (Date.now() < _suppressConnectionLostUntil) return;
  if (_lastNetworkChangedAt && Date.now() - _lastNetworkChangedAt < 12000) {
    logToServer('近期已 network-changed，跳过 connection-lost', 'network');
    return;
  }
  if (isReceiverIceRestarting()) {
    logToServer('ICE restart 协商中，跳过 connection-lost', 'network');
    return;
  }
  if (_reconnecting || probePC || turnProbePC) return;
  const turnPath = _onTurn || _lastOfferUseTURN;
  if (p2pPC && p2pPC._createdAt && Date.now() - p2pPC._createdAt < 12000 && turnPath) {
    return;
  }
  if (ws && ws.readyState === 1) {
    logToServer('发送 connection-lost ice=' + (p2pPC ? p2pPC.iceConnectionState : 'closed'), 'network');
    ws.send(JSON.stringify({
      type: 'connection-lost',
      receiverId: myReceiverId,
      iceState: p2pPC ? p2pPC.iceConnectionState : 'closed',
    }));
  }
}

function closePCIntentionally() {
  clearReceiverDisconnectTimer();
  if (!p2pPC) return;
  p2pPC._intentionalClose = true;
  p2pPC.close();
  p2pPC = null;
  p2pRemoteStream = null;
  pendingCandidates = [];
}

function cleanupProbePC() {
  if (!probePC) return;
  probePC._intentionalClose = true;
  probePC.close();
  probePC = null;
  probeRemoteStream = null;
  probePendingCandidates = [];
}

function cleanupTurnProbePC() {
  if (!turnProbePC) return;
  turnProbePC._intentionalClose = true;
  turnProbePC.close();
  turnProbePC = null;
  turnProbeRemoteStream = null;
  turnProbePendingCandidates = [];
}

function promoteTurnProbeConnection() {
  if (!turnProbePC) return;
  _reconnecting = false;
  stopMediaWatchdog();
  closePCIntentionally();
  p2pPC = turnProbePC;
  turnProbePC = null;
  pendingCandidates = turnProbePendingCandidates;
  turnProbePendingCandidates = [];
  _lastOfferUseTURN = true;

  const beginTurnPlayback = (stream) => {
    p2pRemoteStream = stream;
    turnProbeRemoteStream = null;
    bindReceiverIceHandlers(p2pPC, true);
    startPlayback(true);
    console.log('[Receiver] TURN 探测成功，已切换');
  };

  if (turnProbeRemoteStream) {
    beginTurnPlayback(turnProbeRemoteStream);
  } else {
    p2pPC.ontrack = (e) => {
      beginTurnPlayback(e.streams[0] || new MediaStream([e.track]));
    };
  }
}

function promoteProbeConnection() {
  if (!probePC) {
    logToServer('p2p-probe-commit 但 probePC 不存在', 'media');
    return;
  }

  if (!probeRemoteStream) {
    const audioTracks = probePC.getReceivers()
      .map(r => r.track)
      .filter(t => t && t.kind === 'audio');
    if (audioTracks.length > 0) {
      probeRemoteStream = new MediaStream(audioTracks);
      logToServer('p2p-probe-commit 从 getReceivers 恢复音频流', 'media');
    } else {
      logToServer('p2p-probe-commit 等待 ontrack', 'media');
      const waitingPc = probePC;
      waitingPc.ontrack = (e) => {
        if (probePC !== waitingPc) return;
        probeRemoteStream = e.streams[0] || new MediaStream([e.track]);
        promoteProbeConnection();
      };
      setTimeout(() => {
        if (probePC === waitingPc && !p2pPC) promoteProbeConnection();
      }, 2500);
      return;
    }
  }

  _reconnecting = false;
  suppressConnectionLost(5000);
  stopMediaWatchdog();
  closePCIntentionally();
  p2pPC = probePC;
  probePC = null;
  p2pRemoteStream = probeRemoteStream;
  probeRemoteStream = null;
  pendingCandidates = probePendingCandidates;
  probePendingCandidates = [];
  _lastOfferUseTURN = false;
  bindReceiverIceHandlers(p2pPC, false);
  logToServer('P2P 探测切换完成，开始播放', 'media');
  startPlayback(false);
}

let _reconnecting = false;
let _mediaWatchTimer = null;

function stopMediaWatchdog() {
  if (_mediaWatchTimer) {
    clearTimeout(_mediaWatchTimer);
    _mediaWatchTimer = null;
  }
}

function startMediaWatchdog() {
  stopMediaWatchdog();
  if (_onTurn || turnProbePC) return;

  let lastBytes = 0;
  let silentChecks = 0;
  let checks = 0;

  const check = async () => {
    if (_onTurn || turnProbePC || !p2pPC) return;
    const ice = p2pPC.iceConnectionState;
    if (ice !== 'connected' && ice !== 'completed') return;

    checks++;
    try {
      const stats = await p2pPC.getStats();
      let bytes = 0;
      stats.forEach(report => {
        if (report.type === 'inbound-rtp' && report.kind === 'audio') {
          bytes = report.bytesReceived || 0;
        }
      });
      if (bytes > lastBytes) {
        stopMediaWatchdog();
        return;
      }
      silentChecks++;
      if (silentChecks >= 4) {
        document.getElementById('playHint').textContent = 'P2P 无声音，重连中...';
        setStatus('buffering', '重连中...');
        logToServer('watchdog: P2P 无声音，通知 network-changed', 'media');
        notifyNetworkChanged();
        return;
      }
    } catch (_) {}

    if (checks < 16) {
      _mediaWatchTimer = setTimeout(check, 500);
    }
  };

  _mediaWatchTimer = setTimeout(check, 1000);
}

function clearReceiverDisconnectTimer() {
  if (_receiverDisconnectTimer) {
    clearTimeout(_receiverDisconnectTimer);
    _receiverDisconnectTimer = null;
  }
}

function resumePlaybackAfterReconnect() {
  if (turnProbePC) return;
  if (!p2pRemoteStream && p2pPC) {
    const receivers = p2pPC.getReceivers().filter(r => r.track && r.track.kind === 'audio');
    if (receivers.length) {
      p2pRemoteStream = new MediaStream(receivers.map(r => r.track));
      logToServer('ICE restart 后从 getReceivers 恢复音频流', 'media');
    }
  }
  if (!p2pRemoteStream) return;
  const isTurn = !!(_onTurn || _lastOfferUseTURN);
  logToServer('resumePlaybackAfterReconnect reconnecting=' + _reconnecting + ' isTurn=' + isTurn, 'media');
  startPlayback(isTurn);
  document.getElementById('playHint').textContent = isTurn ? 'TURN 中继（16kbps）' : '';
  setStatus('playing', isTurn ? 'TURN 中继 📡' : '播放中');
}

function bindReceiverIceHandlers(pc, useTurn) {
  pc.onicegatheringstatechange = () => {
    if (pc._intentionalClose) return;
    if (pc.iceGatheringState === 'complete' && useTurn) {
      logToServer('TURN gathering complete ice=' + pc.iceConnectionState, 'ice');
    }
  };

  pc.oniceconnectionstatechange = () => {
    if (pc._intentionalClose) return;
    const ice = pc.iceConnectionState;
    const turnPath = !!(useTurn || _lastOfferUseTURN || _onTurn);
    logToServer('ice=' + ice + ' useTurn=' + useTurn, 'ice');

    if (ice === 'connected' || ice === 'completed') {
      if (_networkRecoveryTimer) {
        clearTimeout(_networkRecoveryTimer);
        _networkRecoveryTimer = null;
      }
      clearReceiverDisconnectTimer();
      _reconnecting = false;
      _receiverIceRestartUntil = 0;
      const isTurn = turnPath;
      setTurnUI(isTurn);
      if (!isTurn) detectRelayMode();
      resumePlaybackAfterReconnect();
    } else if (ice === 'failed') {
      clearReceiverDisconnectTimer();
      _reconnecting = false;
      if (isReceiverIceRestarting()) {
        logToServer('ICE restart 协商 failed，等待 sender 重连', 'network');
        document.getElementById('playHint').textContent = '网络切换，重连中...';
        setStatus('buffering', '重连中...');
        return;
      }
      if (!turnPath && !turnProbePC) {
        _lastNetworkChangedAt = Date.now();
        suppressConnectionLost(15000);
        logToServer('ice failed，通知 network-changed', 'network');
        notifyNetworkChanged();
      } else if (turnPath && pc._createdAt && Date.now() - pc._createdAt < 12000) {
        logToServer('TURN 协商 failed（瞬态），等待 sender 重建', 'network');
      }
      document.getElementById('playHint').textContent = '连接断开，等待重连...';
      setStatus('buffering', '重连中...');
    } else if (ice === 'disconnected') {
      if (isReceiverIceRestarting()) {
        logToServer('ICE restart 协商 disconnected，等待恢复', 'network');
        return;
      }
      if (!turnPath && !turnProbePC) {
        _lastNetworkChangedAt = Date.now();
        suppressConnectionLost(15000);
        logToServer('ice disconnected，通知 network-changed', 'network');
        notifyNetworkChanged();
      }
      clearReceiverDisconnectTimer();
      _receiverDisconnectTimer = setTimeout(() => {
        _receiverDisconnectTimer = null;
        if (!p2pPC || p2pPC !== pc) return;
        const current = pc.iceConnectionState;
        if (current !== 'disconnected' && current !== 'failed') return;
        if (turnPath && pc._createdAt && Date.now() - pc._createdAt < 12000) {
          logToServer('TURN 协商 disconnected（瞬态），不发 connection-lost', 'network');
          return;
        }
        if (isReceiverIceRestarting()) return;
        _reconnecting = false;
        notifyConnectionLost();
        document.getElementById('playHint').textContent = '连接断开，等待重连...';
        setStatus('buffering', '重连中...');
      }, turnPath ? 5000 : 1200);
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc._intentionalClose) return;
    if (pc.connectionState === 'failed') {
      clearReceiverDisconnectTimer();
      const turnPath = !!(useTurn || _lastOfferUseTURN || _onTurn);
      if (turnPath && pc._createdAt && Date.now() - pc._createdAt < 12000) return;
      if (isReceiverIceRestarting()) return;
      notifyConnectionLost();
    }
  };
}

window.addEventListener('online', () => {
  if (roomCode && (!ws || ws.readyState !== WebSocket.OPEN)) {
    scheduleWsReconnect();
  } else if (roomCode && ws && ws.readyState === WebSocket.OPEN) {
    notifyNetworkChanged();
  }
});

// --- Initialize UI based on URL params ---
const urlParams = new URLSearchParams(window.location.search);
const preCode = urlParams.get('code');
const allowMultiJoin = urlParams.get('multi') === '1';

function buildJoinMessage(code, opts) {
  const msg = {
    type: 'join',
    code,
    clientId: getOrCreateClientId(),
    nickname: (opts && opts.nickname) ? opts.nickname.trim() : getNicknameFromUI(),
  };
  const stored = getReceiverSession(code);
  const tab = getTabSession();
  if (stored && stored.receiverId && stored.joinToken) {
    msg.resumeReceiverId = stored.receiverId;
    msg.joinToken = stored.joinToken;
  } else if (tab && tab.roomCode === code && tab.receiverId && tab.joinToken) {
    msg.resumeReceiverId = tab.receiverId;
    msg.joinToken = tab.joinToken;
  }
  if (opts && opts.replaceSession === false) {
    msg.replaceSession = false;
  } else if (!allowMultiJoin) {
    msg.replaceSession = true;
  }
  if (msg.resumeReceiverId && opts?.reconnectWebRTC !== false) {
    msg.reconnectWebRTC = true;
  }
  if (opts && opts.reconnectWebRTC === false) {
    delete msg.reconnectWebRTC;
  }
  Object.assign(msg, getNetworkHint());
  return msg;
}

// --- 码率控制（点击式阶梯） ---
const BR_LEVELS = [750000, 256000, 128000, 64000, 32000, 16000];
const BR_TAGS = ['无损', '高', '中', '低', '极低', '省流'];
const BR_SHORT = ['750K', '256K', '128K', '64K', '32K', '16K'];
let currentBitrate = 750000;
let currentBrIndex = 0; // 默认无损


function buildBrToggle() {
  const container = document.getElementById('brToggle');
  container.innerHTML = BR_LEVELS.map((br, i) => {
    const active = br === currentBitrate ? ' active' : '';
    return `<div class="br-toggle-item${active}" data-index="${i}" onclick="onBrClick(this)">
      <span class="br-tag">${BR_TAGS[i]}</span>
    </div>`;
  }).join('');
}

function onBrClick(el) {
  if (_onTurn) return;
  const index = parseInt(el.dataset.index);
  currentBitrate = BR_LEVELS[index];
  currentBrIndex = index;
  updateBrUI(index);
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'bitrate-change', bitrate: currentBitrate }));
  }
  console.log(`[Bitrate] 手动切到: ${BR_TAGS[index]} (${BR_SHORT[index]})`);
}

function updateBrUI(index) {
  document.querySelectorAll('.br-toggle-item').forEach(el => {
    const i = parseInt(el.dataset.index);
    el.classList.toggle('active', i === index);
  });
}

function sendBitrate(br) {
  currentBitrate = br;
  const idx = BR_LEVELS.indexOf(br);
  if (idx !== -1) {
    currentBrIndex = idx;
    updateBrUI(idx);
  }
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'bitrate-change', bitrate: br }));
  }
}

// --- TURN 检测（辅助） ---
let _lastOfferUseTURN = false;
function detectRelayMode() {
  if (!p2pPC || _onTurn || probePC || turnProbePC) return;
  p2pPC.getStats().then(stats => {
    let hasRelay = false;
    stats.forEach(report => {
      if (report.type === 'candidate-pair' && report.state === 'succeeded') {
        if (report.localCandidateType === 'relay' || report.remoteCandidateType === 'relay') {
          hasRelay = true;
        }
      }
    });
    if (hasRelay) setTurnUI(true);
  }).catch(() => {});
}

// --- WebSocket (signaling only) ---
let _wsReconnectTimer = null;
const HEARTBEAT_INTERVAL_MS = 5 * 60 * 1000;
let _heartbeatTimer = null;

function startRoomHeartbeat() {
  stopRoomHeartbeat();
  if (!roomCode) return;
  _heartbeatTimer = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      try { ws.send(JSON.stringify({ type: 'ping' })); } catch (_) {}
    }
  }, HEARTBEAT_INTERVAL_MS);
}

function stopRoomHeartbeat() {
  if (_heartbeatTimer) {
    clearInterval(_heartbeatTimer);
    _heartbeatTimer = null;
  }
}

function scheduleWsReconnect() {
  if (!roomCode || _wsReconnectTimer) return;
  _wsReconnectTimer = setTimeout(() => {
    _wsReconnectTimer = null;
    if (!roomCode || (ws && ws.readyState === WebSocket.OPEN)) return;
    _wsReconnecting = true;
    const storedNick = myNickname || getReceiverSession(roomCode)?.nickname;
    connectWS().then(() => {
      ws.send(JSON.stringify(buildJoinMessage(roomCode, {
        replaceSession: false,
        nickname: storedNick,
        reconnectWebRTC: false,
      })));
    }).catch(() => {
      _wsReconnecting = false;
      scheduleWsReconnect();
    });
  }, 3000);
}

function connectWS() {
  return new Promise((resolve, reject) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      resolve();
      return;
    }

    const oldWs = ws;
    ws = null;
    if (oldWs) {
      oldWs.onclose = null;
      oldWs.onmessage = null;
      oldWs.onerror = null;
      try { oldWs.close(); } catch (_) {}
    }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    const timeout = setTimeout(() => {
      ws.close();
      reject(new Error('连接超时'));
    }, 8000);

    ws.onopen = () => {
      clearTimeout(timeout);
      if (roomCode) startRoomHeartbeat();
      resolve();
    };
    ws.onerror = (e) => { clearTimeout(timeout); reject(new Error('WebSocket 连接失败')); };
    ws.onclose = () => {
      stopRoomHeartbeat();
      setStatus('connected', '信令断开，音频继续');
      scheduleWsReconnect();
    };

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handleSignaling(msg);
    };
  });
}

// --- Signaling ---
function handleSignaling(msg) {
  switch (msg.type) {
    case 'error': {
      _wsReconnecting = false;
      const errText = msg.message || '连接失败';
      logToServer('join error: ' + errText + ' code=' + (msg.code || ''), 'session');
      if (msg.code === 'nickname_taken' || msg.code === 'invalid_nickname' || msg.code === 'room_full') {
        showJoinError(errText, msg.code);
        const btn = document.getElementById('btnActivate') || document.getElementById('btnJoin');
        if (btn) { btn.disabled = false; btn.textContent = btn.id === 'btnActivate' ? '▶ 重试' : '确认加入'; }
        return;
      }
      if (msg.code === 'session_expired' || msg.code === 'room_expired' || msg.code === 'room_not_found') {
        if (msg.code === 'session_expired' && roomCode) {
          // Token expired — retry as fresh join without resume tokens
          clearReceiverSession(roomCode);
          logToServer('session expired, retrying fresh join', 'session');
          try {
            ws.send(JSON.stringify(buildJoinMessage(roomCode, { replaceSession: false })));
            return;
          } catch (_) {}
        }
        showJoinError(errText, msg.code);
        return;
      }
      document.getElementById('playHint').textContent = errText;
      document.getElementById('playHint').style.color = '#fca5a5';
      break;
    }

    case 'joined': {
      _wsReconnecting = false;
      myReceiverId = msg.receiverId || ('device-' + Date.now().toString(36));
      myNickname = msg.nickname || myNickname || myReceiverId;
      myJoinToken = msg.joinToken || myJoinToken;
      logToServer('【版本】V6.20-room-heartbeat joined id=' + myReceiverId + ' nick=' + myNickname + ' resumed=' + !!msg.resumed, 'version');
      if (roomCode) {
        saveReceiverSession(roomCode, {
          receiverId: myReceiverId,
          joinToken: myJoinToken,
          nickname: myNickname,
        });
        saveTabSession({
          roomCode,
          receiverId: myReceiverId,
          joinToken: myJoinToken,
          nickname: myNickname,
        });
      }
      const iceOk = p2pPC && (p2pPC.iceConnectionState === 'connected' || p2pPC.iceConnectionState === 'completed');
      if (msg.resumed && iceOk) {
        logToServer('resume: P2P still connected, skip PC rebuild', 'session');
        resumePlaybackAfterReconnect();
        setStatus('playing', '已连接 · ' + myNickname);
      } else {
        document.getElementById('playHint').textContent = '等待音频...';
        setStatus('connected', '已连接 · ' + myNickname);
      }
      document.getElementById('bitrateControl').classList.remove('hidden');
      buildBrToggle();
      if (msg.qrDataUrl) {
        document.getElementById('qrImage').src = msg.qrDataUrl;
      }
      if (navigator.connection && !window._netChangeBound) {
        window._netChangeBound = true;
        navigator.connection.addEventListener('change', () => {
          if (roomCode && myReceiverId) notifyNetworkChanged();
        });
      }
      startRoomHeartbeat();
      break;
    }

    case 'sender-disconnected':
      setStatus('connected', '发送端断开，等待恢复…');
      logToServer('sender-disconnected (grace)', 'session');
      break;

    case 'bitrate-change':
      if (msg.bitrate) {
        const idx = BR_LEVELS.indexOf(msg.bitrate);
        if (idx !== -1) {
          currentBitrate = msg.bitrate;
          currentBrIndex = idx;
          updateBrUI(idx);
        }
      }
      break;

    case 'connection-status':
      if (msg.mode === 'turn') {
        setTurnUI(true);
      } else if (msg.mode === 'p2p') {
        setTurnUI(false);
      }
      break;

    case 'turn-probe-start':
      console.log('[Receiver] sender 并行探测 TURN，P2P 主连接保持播放');
      document.getElementById('playHint').textContent = '正在切换 TURN...';
      setStatus('buffering', '切换 TURN...');
      break;

    case 'turn-probe-commit':
      promoteTurnProbeConnection();
      break;

    case 'p2p-probe-start':
      console.log('[Receiver] sender 并行探测 P2P，主连接保持播放');
      break;

    case 'p2p-probe-commit':
      promoteProbeConnection();
      break;

    case 'reconnect-p2p':
      console.log('[Receiver] sender 请求 P2P 重连');
      suppressConnectionLost(5000);
      _reconnecting = true;
      stopMediaWatchdog();
      cleanupProbePC();
      cleanupTurnProbePC();
      closePCIntentionally();
      _lastOfferUseTURN = false;
      isPlaying = false;
      document.getElementById('playHint').textContent = '网络切换，重连中...';
      setStatus('buffering', '重连中...');
      break;

    case 'force-rejoin':
      logToServer('sender 要求恢复会话 force-rejoin', 'recover');
      suppressConnectionLost(5000);
      stopMediaWatchdog();
      cleanupProbePC();
      cleanupTurnProbePC();
      closePCIntentionally();
      isPlaying = false;
      _reconnecting = false;
      document.getElementById('playHint').textContent = '重新连接...';
      setStatus('buffering', '重连中...');
      if (ws && ws.readyState === WebSocket.OPEN && roomCode) {
        ws.send(JSON.stringify(buildJoinMessage(roomCode, {
          replaceSession: false,
          nickname: myNickname || getReceiverSession(roomCode)?.nickname,
          reconnectWebRTC: true,
        })));
      }
      break;

    case 'session-replaced':
      logToServer('会话已被新页面取代 session-replaced', 'session');
      suppressConnectionLost(5000);
      stopPlayback();
      document.getElementById('playHint').textContent = '已在其他页面打开';
      setStatus('error', '已在其他页面打开');
      if (ws) {
        try { ws.close(); } catch (_) {}
      }
      break;

    case 'reconnect-relay':
      console.log('[Receiver] 直接切换 TURN（无并行探测）');
      suppressConnectionLost(12000);
      _reconnecting = true;
      closePCIntentionally();
      _lastOfferUseTURN = true;
      setTurnUI(true);
      document.getElementById('playHint').textContent = '正在切换 TURN...';
      break;

    case 'webrtc-offer':
      handleWebRTCOffer(msg);
      break;

    case 'webrtc-ice':
      if (msg.isTurnProbe) {
        if (turnProbePC) {
          turnProbePC.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
        } else if (msg.candidate) {
          turnProbePendingCandidates.push(msg.candidate);
        }
        break;
      }
      if (msg.isProbe) {
        if (probePC) {
          probePC.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
        } else if (msg.candidate) {
          probePendingCandidates.push(msg.candidate);
        }
        break;
      }
      if (p2pPC) {
        p2pPC.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
      } else if (msg.candidate) {
        pendingCandidates.push(msg.candidate);
      }
      break;

    case 'peer-disconnected':
      stopPlayback();
      setStatus('error', '发送端已断开');
      break;

    case 'error':
      setStatus('error', '❌ ' + msg.message);
      document.getElementById('playHint').textContent = '❌ ' + msg.message;
      document.getElementById('playHint').style.color = '#fca5a5';
      break;
  }
}

// --- WebRTC: Handle incoming offer from sender ---
function handleWebRTCOffer(msg) {
  if (msg.isTurnProbe) {
    handleTurnProbeOffer(msg);
    return;
  }
  if (msg.isProbe) {
    handleProbeOffer(msg);
    return;
  }

  const useTurn = !!msg.useTURN;

  if (useTurn && p2pPC && p2pPC._createdAt) {
    const age = Date.now() - p2pPC._createdAt;
    const ice = p2pPC.iceConnectionState;
    if (age < 8000 && (ice === 'checking' || ice === 'new' || ice === 'connecting')) {
      logToServer('忽略重复 TURN offer（协商中 age=' + age + 'ms ice=' + ice + '）', 'webrtc');
      return;
    }
  }

  logToServer(
    '收到 offer useTURN=' + useTurn + ' iceRestart=' + !!msg.iceRestart + ' hasPC=' + !!p2pPC,
    'webrtc'
  );

  if (msg.iceRestart && p2pPC && !useTurn && !_lastOfferUseTURN) {
    _reconnecting = false;
    _lastOfferUseTURN = false;
    _receiverIceRestartUntil = Date.now() + 12000;
    suppressConnectionLost(12000);
    logToServer('ICE restart 重协商', 'webrtc');
    document.getElementById('playHint').textContent = '网络切换，重连中...';
    setStatus('buffering', '重连中...');

    const flushPendingCandidates = () => {
      pendingCandidates.forEach(c => {
        p2pPC.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      });
      pendingCandidates = [];
    };

    p2pPC.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => {
      flushPendingCandidates();
      return p2pPC.createAnswer();
    }).then(answer => p2pPC.setLocalDescription(answer)).then(() => {
      if (ws.readyState === 1) {
        ws.send(JSON.stringify({
          type: 'webrtc-answer',
          receiverId: myReceiverId,
          sdp: p2pPC.localDescription.toJSON(),
        }));
        logToServer('ICE restart 已发送 answer', 'webrtc');
      }
    }).catch((err) => {
      logToServer('ICE restart answer 失败: ' + (err?.message || err), 'webrtc');
      closePCIntentionally();
      notifyNetworkChanged();
    });
    return;
  }

  if (msg.iceRestart && !p2pPC) {
    logToServer('iceRestart offer 但 PC 已关闭，按全新连接处理', 'webrtc');
  }

  if (p2pPC) {
    closePCIntentionally();
    isPlaying = false;
  }

  if (!msg.iceRestart) {
    _receiverIceRestartUntil = 0;
  }

  _reconnecting = false;

  const pcConfig = useTurn
    ? { iceServers: ICE_SERVERS, iceTransportPolicy: 'relay' }
    : { iceServers: STUN_SERVERS };
  _lastOfferUseTURN = useTurn;
  logToServer('创建连接 useTURN=' + useTurn, 'webrtc');
  p2pPC = new RTCPeerConnection(pcConfig);
  p2pPC._createdAt = Date.now();

  p2pPC.ontrack = (e) => {
    p2pRemoteStream = e.streams[0];
    startPlayback(useTurn);
  };

  p2pPC.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-ice', receiverId: myReceiverId, candidate: e.candidate.toJSON() }));
    }
  };

  bindReceiverIceHandlers(p2pPC, useTurn);

  const flushPendingCandidates = () => {
    pendingCandidates.forEach(c => {
      p2pPC.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
    });
    pendingCandidates = [];
  };

  p2pPC.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => {
    flushPendingCandidates();
    return p2pPC.createAnswer();
  }).then(answer => p2pPC.setLocalDescription(answer)).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-answer', receiverId: myReceiverId, sdp: p2pPC.localDescription.toJSON() }));
      logToServer('已发送 answer useTURN=' + useTurn, 'webrtc');
    }
  }).catch((err) => {
    logToServer('offer 处理失败: ' + (err?.message || err), 'webrtc');
    if (p2pPC) { p2pPC.close(); p2pPC = null; }
    notifyNetworkChanged();
  });
}

function handleTurnProbeOffer(msg) {
  cleanupTurnProbePC();

  turnProbePC = new RTCPeerConnection({
    iceServers: ICE_SERVERS,
    iceTransportPolicy: 'relay',
  });
  turnProbePC.ontrack = (e) => {
    turnProbeRemoteStream = e.streams[0] || new MediaStream([e.track]);
  };
  turnProbePC.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-ice',
        receiverId: myReceiverId,
        isTurnProbe: true,
        candidate: e.candidate.toJSON(),
      }));
    }
  };
  turnProbePC.oniceconnectionstatechange = () => {
    if (turnProbePC._intentionalClose) return;
    if (turnProbePC.iceConnectionState === 'failed') {
      cleanupTurnProbePC();
    }
  };

  turnProbePC.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => {
    turnProbePendingCandidates.forEach(c => {
      turnProbePC.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
    });
    turnProbePendingCandidates = [];
    return turnProbePC.createAnswer();
  }).then(answer => turnProbePC.setLocalDescription(answer)).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-answer',
        receiverId: myReceiverId,
        isTurnProbe: true,
        sdp: turnProbePC.localDescription.toJSON(),
      }));
    }
  }).catch(() => cleanupTurnProbePC());
}

function handleProbeOffer(msg) {
  cleanupProbePC();

  probePC = new RTCPeerConnection({ iceServers: STUN_SERVERS });
  probePC.ontrack = (e) => {
    probeRemoteStream = e.streams[0] || new MediaStream([e.track]);
  };
  probePC.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-ice',
        receiverId: myReceiverId,
        isProbe: true,
        candidate: e.candidate.toJSON(),
      }));
    }
  };
  probePC.oniceconnectionstatechange = () => {
    if (probePC._intentionalClose) return;
    if (probePC.iceConnectionState === 'failed') {
      cleanupProbePC();
    }
  };

  probePC.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => {
    probePendingCandidates.forEach(c => {
      probePC.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
    });
    probePendingCandidates = [];
    return probePC.createAnswer();
  }).then(answer => probePC.setLocalDescription(answer)).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-answer',
        receiverId: myReceiverId,
        isProbe: true,
        sdp: probePC.localDescription.toJSON(),
      }));
    }
  }).catch(() => cleanupProbePC());
}

function startPlayback(isTurn) {
  if (!p2pRemoteStream) return;
  logToServer('startPlayback isTurn=' + !!isTurn + ' ice=' + (p2pPC ? p2pPC.iceConnectionState : 'none'), 'media');

  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  setTurnUI(!!isTurn);

  const audioEl = document.getElementById('p2pAudio');
  if (audioEl.src && !audioEl.srcObject) {
    audioEl.removeAttribute('src');
    audioEl.load();
  }
  audioEl.srcObject = p2pRemoteStream;
  audioEl.muted = false;
  audioEl.volume = 1;

  const doPlay = () => {
    const p = audioEl.play();
    if (p) p.catch(() => setTimeout(doPlay, 300));
  };
  doPlay();

  isPlaying = true;
  if (!isTurn) startMediaWatchdog();
  else stopMediaWatchdog();
}

function stopPlayback() {
  clearReceiverDisconnectTimer();
  stopMediaWatchdog();
  cleanupProbePC();
  cleanupTurnProbePC();
  const audioEl = document.getElementById('p2pAudio');
  if (audioEl.srcObject) audioEl.srcObject = null;
  if (p2pPC) { p2pPC.close(); p2pPC = null; }
  p2pRemoteStream = null;
  pendingCandidates = [];
  isPlaying = false;
  _onTurn = false;
  document.getElementById('playHint').textContent = '已停止';
  setStatus('connected', '已停止');
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot';
  if (state === 'connected') dot.classList.add('connected');
  if (state === 'playing') dot.classList.add('playing');
  if (state === 'buffering') dot.classList.add('buffering');
  if (state === 'error') dot.classList.add('error');
  document.getElementById('statusText').textContent = text;
}
