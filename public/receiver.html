<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>音频播放</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f; color: #e0e0e0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .container { max-width: 400px; width: 100%; padding: 32px 24px; text-align: center; }
  h1 {
    font-size: 24px; font-weight: 700; margin-bottom: 6px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 28px; font-size: 13px; }
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 24px; padding: 10px 16px;
    background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 13px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #555; transition: background 0.3s;
  }
  .status-dot.connected { background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
  .status-dot.playing { background: #22d3ee; box-shadow: 0 0 6px #22d3ee66; animation: pulse 1.5s infinite; }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 6px #ef444466; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 28px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  .btn-connect { background: linear-gradient(135deg, #4ade80, #22d3ee); color: #0a0a0f; }
  .btn-connect:hover { opacity: 0.9; }
  .btn-connect:disabled { opacity: 0.4; cursor: not-allowed; }

  .br-toggle { display: flex; gap: 3px; justify-content: center; align-items: stretch; flex-wrap: nowrap; margin: 8px 0; }
  .br-toggle-item {
    flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.03); color: #888; font-size: 8px; font-weight: 500;
    cursor: pointer; text-align: center; transition: all 0.15s; min-width: 0;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    user-select: none;
  }
  .br-toggle-item .br-tag { font-size: 10px; font-weight: 500; opacity: 0.7; }
  .br-toggle-item:active { transform: scale(0.95); }
  .br-toggle-item.active { background: rgba(74,222,128,0.15); color: #4ade80; border-color: #4ade8066; }
  .br-toggle-item.active .br-tag { opacity: 0.8; }
  .br-toggle-item.disabled { opacity: 0.25; pointer-events: none; }

  #playQrContainer {
    margin: 20px 0;
  }
  #playQrContainer img { border-radius: 12px; }

  .hidden { display: none !important; }

  .tip {
    margin-top: 24px; padding: 10px 14px;
    background: rgba(74, 222, 128, 0.08); border-left: 3px solid #4ade80;
    border-radius: 0 8px 8px 0; font-size: 12px; color: #8b9; text-align: left;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎧 Audio Stream</h1>
  <p class="subtitle">手机端播放</p>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">未连接</span>
  </div>

  <div id="actionArea"></div>

  <div id="playArea" class="hidden">
    <div id="playQrContainer">
      <div style="background:white; border-radius:12px; padding:12px; display:inline-block;">
        <img id="qrImage" style="width:160px;height:160px; display:block;" alt="QR">
      </div>
      <p style="color:#888; font-size:11px; margin-top:6px;">📱 让朋友扫码一起听</p>
    </div>
    <p style="color:#666; font-size:12px;" id="playHint">连接中...</p>
    <audio id="p2pAudio" autoplay style="display:none;"></audio>
    <div id="bitrateControl" class="hidden" style="margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.06);">
      <label style="font-size:12px; color:#888; display:block; margin-bottom:6px;">音质</label>
      <div id="brToggle" class="br-toggle"></div>
    </div>
  </div>

  <div class="tip hidden">💡 点击按钮即可开始收听。请确保手机音量已打开。</div>
</div>

<script>
let ws = null;
let roomCode = null;
let isPlaying = false;
let myReceiverId = null;
let audioCtx = null; // 用户手势激活的 AudioContext

// WebRTC
let p2pPC = null;
let p2pRemoteStream = null;
let p2pAudioEl = null;
let pendingCandidates = []; // 缓存 p2pPC 创建前到达的 ICE candidate
const ICE_SERVERS = [
  { urls: 'stun:stun.qq.com:3478' },
  { urls: 'stun:stun.aliyun.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'turn:39.101.174.208:3478', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
  { urls: 'turn:39.101.174.208:3478?transport=tcp', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
];

// Store code from URL
let pendingCode = null;

// 中继播放相关
let relayDataChunks = [];    // 累积的中继数据（ArrayBuffer）
let relayBlobTimer = null;   // 定时器
let relayBlobPlaying = false;
let relayMode = false;

function initRelayPlayback() {
  // 不需要初始化——Blob 播放不需要 MediaSource
  console.log('[Relay] Blob播放模式');
}

function appendRelayData(buf) {
  relayDataChunks.push(buf);
  if (!relayBlobPlaying) {
    playRelayChunk();
  }
}

function playRelayChunk() {
  if (relayDataChunks.length === 0) {
    relayBlobPlaying = false;
    return;
  }
  relayBlobPlaying = true;
  const chunks = relayDataChunks.splice(0);
  const blob = new Blob(chunks, { type: 'audio/webm;codecs=opus' });
  const url = URL.createObjectURL(blob);
  const audioEl = document.getElementById('p2pAudio');
  // 释放旧 URL
  if (audioEl._relayBlobUrl) URL.revokeObjectURL(audioEl._relayBlobUrl);
  audioEl._relayBlobUrl = url;
  audioEl.src = url;
  audioEl.play().catch(() => {});
  // 当前段播完后自动切到下一段（用 timeupdate 检测即将结束）
  audioEl.onended = () => {
    playRelayChunk();
  };
  // 2 秒兜底：如果还没播完就切（避免过大延迟）
  clearTimeout(relayBlobTimer);
  relayBlobTimer = setTimeout(() => {
    if (audioEl.paused) return;
    const remaining = audioEl.duration - audioEl.currentTime;
    if (remaining < 0.5 && relayDataChunks.length > 0) {
      playRelayChunk();
    }
  }, 2000);
}

// --- Initialize UI based on URL params ---
const urlParams = new URLSearchParams(window.location.search);
const preCode = urlParams.get('code');

window.addEventListener('DOMContentLoaded', () => {
  const actionArea = document.getElementById('actionArea');

  // 如果页面是从 bfcache 恢复（手机切后台再切回来），自动恢复连接
  if (preCode && document.getElementById('btnActivate')) {
    // 已有按钮，说明页面状态正确，不做额外操作
  }

  if (preCode) {
    pendingCode = preCode.toUpperCase();
    actionArea.innerHTML = `
      <button class="btn btn-connect" id="btnActivate" style="font-size:18px; padding:20px;">
        ▶ 点击开始收听
      </button>
      <p style="color:#666; font-size:12px; margin-top:12px;">房间: ${pendingCode}</p>
    `;
    document.getElementById('btnActivate').addEventListener('click', () => {
      // 预激活音频上下文，绕过移动端自动播放限制
      const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (tempCtx.state === 'suspended') tempCtx.resume();
      // 同时预激活 audio 元素+初始化 MediaSource
      const audioEl = document.getElementById('p2pAudio');
      audioEl.play().then(() => audioEl.pause()).catch(() => {});
      // 在用户手势中初始化 MediaSource
      initRelayPlayback();
      activatePlayback(tempCtx);
    });
  } else {
    actionArea.innerHTML = `
      <div style="margin-bottom:20px;">
        <input type="text" id="codeInput" placeholder="输入房间码" maxlength="5" autocomplete="off"
          style="width:100%; padding:14px 18px; border:2px solid rgba(255,255,255,0.1); border-radius:12px;
          background:rgba(255,255,255,0.05); color:#e0e0e0; font-size:20px; font-weight:700;
          letter-spacing:6px; text-align:center; text-transform:uppercase; outline:none;">
      </div>
      <button class="btn btn-connect" id="btnJoin" onclick="manualJoin()">连接</button>
    `;
  }
});

// 处理 bfcache 恢复：手机切后台再切回来时不会重新执行 DOMContentLoaded
window.addEventListener('pageshow', (e) => {
  if (e.persisted && roomCode && isPlaying) {
    // 页面从 bfcache 恢复，重新激活音频
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    const audioEl = document.getElementById('p2pAudio');
    if (audioEl && audioEl.srcObject) {
      audioEl.play().catch(() => {});
    }
  }
});

// --- Auto-join from QR scan (with pre-activated audio context) ---
async function activatePlayback(ctx) {
  audioCtx = ctx;
  const btn = document.getElementById('btnActivate');
  btn.disabled = true;
  btn.textContent = '连接中...';

  // 在用户手势中初始化 MediaSource——iOS Safari 要求 sourceopen 在用户手势中触发
  initRelayPlayback();
  const audioEl = document.getElementById('p2pAudio');
  audioEl.play().catch(() => {});
  audioEl.pause();

  try {
    document.getElementById('actionArea').classList.add('hidden');
    document.getElementById('playArea').classList.remove('hidden');
    document.getElementById('playHint').textContent = '连接中...';
    setStatus('buffering', '连接中...');

    await connectWS();
    roomCode = pendingCode;
    document.getElementById('playHint').textContent = '等待音频...';
    ws.send(JSON.stringify({ type: 'join', code: pendingCode }));
  } catch (err) {
    document.getElementById('playHint').textContent = '连接失败，请重试';
    document.getElementById('playHint').style.color = '#fca5a5';
    btn.disabled = false;
    btn.textContent = '▶ 重试';
  }
}

// --- Manual join ---
async function manualJoin() {
  const codeEl = document.getElementById('codeInput');
  const btn = document.getElementById('btnJoin');
  const code = codeEl.value.trim().toUpperCase();
  if (code.length < 4) { alert('请输入有效的房间码'); return; }

  btn.disabled = true;
  btn.textContent = '连接中...';

  // 在用户手势中初始化 MediaSource
  initRelayPlayback();
  const audioEl = document.getElementById('p2pAudio');
  audioEl.play().catch(() => {});
  audioEl.pause();

  try {
    await connectWS();
    roomCode = code;
    ws.send(JSON.stringify({ type: 'join', code }));
  } catch (err) {
    alert('连接服务器失败');
    btn.disabled = false;
    btn.textContent = '连接';
  }
}

// --- 码率控制（点击式阶梯） ---
const BR_LEVELS = [750000, 256000, 128000, 64000, 32000, 16000];
const BR_TAGS = ['无损', '高', '中', '低', '极低', '省流'];
const BR_SHORT = ['750K', '256K', '128K', '64K', '32K', '16K'];
let currentBitrate = 750000;
let currentBrIndex = 0; // 默认无损


function buildBrToggle() {
  const container = document.getElementById('brToggle');
  container.innerHTML = BR_LEVELS.map((br, i) => {
    const active = br === currentBitrate ? ' active' : '';
    return `<div class="br-toggle-item${active}" data-index="${i}" onclick="onBrClick(this)">
      <span class="br-tag">${BR_TAGS[i]}</span>
    </div>`;
  }).join('');
}

function onBrClick(el) {
  const index = parseInt(el.dataset.index);
  currentBitrate = BR_LEVELS[index];
  currentBrIndex = index;
  updateBrUI(index);
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'bitrate-change', bitrate: currentBitrate }));
  }
  console.log(`[Bitrate] 手动切到: ${BR_TAGS[index]} (${BR_SHORT[index]})`);
}

function updateBrUI(index) {
  document.querySelectorAll('.br-toggle-item').forEach(el => {
    const i = parseInt(el.dataset.index);
    el.classList.toggle('active', i === index);
  });
}

function sendBitrate(br) {
  currentBitrate = br;
  const idx = BR_LEVELS.indexOf(br);
  if (idx !== -1) {
    currentBrIndex = idx;
    updateBrUI(idx);
  }
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'bitrate-change', bitrate: br }));
  }
}

// --- TURN relay 检测：走服务器流量时强制 16kbps ---
let _relayDetected = false;
let _lastOfferUseTURN = false; // 最近一次 offer 是否 useTURN
function detectRelayMode() {
  if (!p2pPC || _relayDetected) return;
  const doCheck = (attempt) => {
    if (!p2pPC || _relayDetected) return;
    p2pPC.getStats().then(stats => {
      let hasRelay = false;
      // 调试日志
      stats.forEach(report => {
        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
          console.log('[DBG] Succeeded pair:', JSON.stringify({
            localCandidateType: report.localCandidateType,
            remoteCandidateType: report.remoteCandidateType,
            nominated: report.nominated,
            priority: report.priority
          }));
        }
        if (report.candidateType === 'relay' || report.type === 'relay') {
          console.log('[DBG] Relay candidate found:', JSON.stringify({
            type: report.type,
            candidateType: report.candidateType,
            ip: report.ip,
            address: report.address,
            port: report.port
          }));
        }
        if (report.ip === '39.101.174.208' || report.address === '39.101.174.208') {
          console.log('[DBG] TURN server IP match');
        }
      });
      // 检测逻辑：只要满足任一条件就算 relay
      stats.forEach(report => {
        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
          if (report.localCandidateType === 'relay' || report.remoteCandidateType === 'relay') hasRelay = true;
        }
      });
      // 只通过 succeeded candidate-pair 判断 relay，不通过独立 candidate 判断
      // （独立的 relay candidate 可能只是收集到了，实际没有使用）
      if (hasRelay) {
        _relayDetected = true;
        console.log('[Relay] 走 TURN 中继，隐藏音质控件，中继流固定 16kbps');
        // 中继模式下不显示音质控制
        document.getElementById('bitrateControl').classList.add('hidden');
      } else {
        console.log('[Relay] 尝试' + attempt + ': P2P直连');
        // 还没稳定，稍后重试
        if (attempt < 3) {
          setTimeout(() => doCheck(attempt + 1), 2000);
        }
      }
    }).catch(() => {
      if (attempt < 3) {
        setTimeout(() => doCheck(attempt + 1), 2000);
      }
    });
  };
  doCheck(1);
}

// --- WebSocket (signaling only) ---
function connectWS() {
  return new Promise((resolve, reject) => {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);
    ws.binaryType = 'arraybuffer';

    const timeout = setTimeout(() => {
      ws.close();
      reject(new Error('连接超时'));
    }, 8000);

    ws.onopen = () => { clearTimeout(timeout); resolve(); };
    ws.onerror = (e) => { clearTimeout(timeout); reject(new Error('WebSocket 连接失败')); };
    ws.onclose = () => {
      setStatus('connected', '信令断开，音频继续');
      // P2P 持续播放，但自动重连信令通道
      if (roomCode) {
        setTimeout(() => {
          if (ws.readyState > 1) {
            connectWS().then(() => {
              ws.send(JSON.stringify({ type: 'join', code: roomCode }));
            }).catch(() => {});
          }
        }, 3000);
      }
    };

    ws.onmessage = (e) => {
      // 二进制数据 = 中继音频
      if (e.data instanceof ArrayBuffer || e.data instanceof Blob) {
        window._relayPktCount = (window._relayPktCount || 0) + 1;
        document.getElementById('playHint').textContent = '中继数据: ' + window._relayPktCount + ' 包';
        const buf = e.data instanceof ArrayBuffer ? e.data : null;
        if (buf) {
          appendRelayData(buf);
        } else {
          e.data.arrayBuffer().then(b => appendRelayData(b));
        }
        return;
      }
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handleSignaling(msg);
    };
  });
}

// --- Signaling ---
function handleSignaling(msg) {
  switch (msg.type) {
    case 'joined': {
      myReceiverId = msg.receiverId || ('device-' + Date.now().toString(36));
      document.getElementById('playHint').textContent = '等待音频...';
      document.getElementById('bitrateControl').classList.remove('hidden');
      buildBrToggle(); // 构建音质阶梯控件
      setStatus('connected', '已连接，等待音频...');
      if (msg.qrDataUrl) {
        document.getElementById('qrImage').src = msg.qrDataUrl;
      }
      // 开启中继保底：MediaSource 已在用户手势中初始化
      // 5秒后如果 P2P 还没连上，切换到中继模式
      setTimeout(() => {
        const p2pConnected = p2pPC && (p2pPC.connectionState === 'connected' || p2pPC.connectionState === 'completed');
        // 不检查 isPlaying——ontrack 可能提前触发了 startPlayback 但 P2P 根本没通
        if (!p2pConnected) {
          console.log('[Relay] 5秒P2P未连通，切换到中继模式');
          if (p2pPC) { p2pPC.close(); p2pPC = null; pendingCandidates = []; }
          isPlaying = false; // 重置，避免 startPlayback 误设
          relayMode = true;
          document.getElementById('bitrateControl').classList.add('hidden');
          document.getElementById('playHint').textContent = '中继模式（16kbps保底）';
          setStatus('playing', '中继播放 📡');
          isPlaying = true;
          const audioEl = document.getElementById('p2pAudio');
          // 如果有累积的中继数据，触发播放
          if (relayDataChunks.length > 0 && !relayBlobPlaying) {
            playRelayChunk();
          }
          audioEl.play().catch(() => {});
        }
      }, 5000);
      break;
    }

    case 'bitrate-change':
      // sender 通知实际码率（中继模式下可能被拒绝，回退到16kbps）
      if (msg.bitrate) {
        const idx = BR_LEVELS.indexOf(msg.bitrate);
        if (idx !== -1) {
          currentBitrate = msg.bitrate;
          currentBrIndex = idx;
          updateBrUI(idx);
          console.log(`[Bitrate] 被锁定为: ${BR_TAGS[idx]}`);
        }
      }
      break;

    case 'connection-status':
      if (msg.mode === 'relay') {
        console.log('[Relay] 中继模式确认');
      }
      break;

    case 'reconnect-p2p':
      // sender 想切回 P2P，重置 PC 等新 offer
      console.log('[Receiver] 收到 reconnect-p2p，重建纯STUN连接，保持中继播放');
      if (p2pPC) { p2pPC.close(); p2pPC = null; }
      pendingCandidates = [];
      _relayDetected = false;
      _lastOfferUseTURN = false; // 重置，后续纯 STUN offer 不会被误判为 TURN
      // 不设 isPlaying = false——中继仍在播，不中断播放
      // 不更新 UI——保持中继模式显示，只有 P2P 真正成功才切换
      // 6秒超时保护：如果 P2P 没真正接通，保持中继不变
      if (window._p2pTimeout) clearTimeout(window._p2pTimeout);
      window._p2pTimeout = setTimeout(() => {
        if (!isPlaying && relayDataChunks.length > 0) {
          console.log('[Receiver] P2P超时未接通，保持中继');
        }
      }, 6000);
      break;

    case 'reconnect-relay':
      // P2P 失败，保持中继保底播放——不改 audio pipeline
      console.log('[Receiver] 收到 reconnect-relay，保持中继模式');
      if (p2pPC) { p2pPC.close(); p2pPC = null; }
      pendingCandidates = [];
      _relayDetected = true;
      // 只清 srcObject（如果之前 startPlayback 绑了 P2P 流）
      const relayAudioEl = document.getElementById('p2pAudio');
      relayAudioEl.onwaiting = null;
      relayAudioEl.onplaying = null;
      if (relayAudioEl.srcObject) {
        relayAudioEl.srcObject = null;
      }
      // TURN 中继模式隐藏音质选择
      document.getElementById('bitrateControl').classList.add('hidden');
      relayMode = true;
      document.getElementById('bitrateControl').classList.add('hidden');
      document.getElementById('playHint').textContent = '中继模式（16kbps保底）';
      setStatus('playing', '中继播放 📡');
      isPlaying = true;
      // 确保 audio 在播（blob 自动触发，不需要额外操作）
      relayAudioEl.play().catch(() => {});
      break;

    case 'webrtc-offer':
      handleWebRTCOffer(msg);
      break;

    case 'webrtc-ice':
      if (p2pPC) {
        p2pPC.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
      } else {
        // PC 还没创建，缓存起来等 offer 到了再处理
        if (msg.candidate) pendingCandidates.push(msg.candidate);
      }
      break;

    case 'peer-disconnected':
      stopPlayback();
      setStatus('error', '发送端已断开');
      break;

    case 'error':
      setStatus('error', '❌ ' + msg.message);
      document.getElementById('playHint').textContent = '❌ ' + msg.message;
      document.getElementById('playHint').style.color = '#fca5a5';
      break;
  }
}

// --- WebRTC: Handle incoming offer from sender ---
function handleWebRTCOffer(msg) {
  // 如果已有 PC 但收到新 offer（reconnect 场景），先清理旧的
  if (p2pPC) {
    console.log('[Receiver] 收到新offer，替换旧连接');
    p2pPC.close();
    p2pPC = null;
    // 中继模式下不重置 isPlaying，保持中继播放
    if (!relayMode) {
      isPlaying = false;
    }
    // 不重置 relayMode——切换新连接时保持中继保底，等 P2P 实际连通再关
    relayBlobPlaying = false;
  }

  // 根据 offer 中的 useTURN 标记决定 ICE 配置
  const servers = msg.useTURN ? ICE_SERVERS : [{ urls: 'stun:stun.qq.com:3478' }, { urls: 'stun:stun.aliyun.com:3478' }, { urls: 'stun:stun.l.google.com:19302' }];
  console.log('[Receiver] 创建连接, useTURN:', !!msg.useTURN);
  _lastOfferUseTURN = !!msg.useTURN;
  p2pPC = new RTCPeerConnection({ iceServers: servers });

  p2pPC.ontrack = (e) => {
    // TURN 模式下走中继播放，不处理 P2P 音频 track
    if (_relayDetected) return;
    p2pRemoteStream = e.streams[0];
    // 强行停止中继，切到 P2P
    relayMode = false;
    isPlaying = false;
    startPlayback();
  };

  p2pPC.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-ice', receiverId: myReceiverId, candidate: e.candidate.toJSON() }));
    }
  };

  p2pPC.onconnectionstatechange = () => {
    const state = p2pPC.connectionState;
    if (state === 'connected' || state === 'completed') {
      console.log('[ICE] P2P连接成功', p2pPC.iceConnectionState);
      // iceConnectionState 为 'connected' 是 P2P，'relay' 是中继
      const iceState = p2pPC.iceConnectionState;
      console.log('[ICE] iceConnectionState:', iceState);
      // 如果 iceConnectionState === 'relay'，直接判定走 TURN
      if (iceState === 'relay' || _lastOfferUseTURN) {
        console.log('[ICE] 确认走TURN中继 (iceState=' + iceState + ', useTURN=' + _lastOfferUseTURN + ')');
        _relayDetected = true;
        // 中继模式下隐藏音质控件
        document.getElementById('bitrateControl').classList.add('hidden');
        // 清除可能的 P2P srcObject，恢复中继 blob 播放
        const audioEl = document.getElementById('p2pAudio');
        if (audioEl.srcObject) {
          audioEl.srcObject = null;
        }
        // 如果有累积中继数据且未播放，触发播放
        if (relayDataChunks.length > 0 && !relayBlobPlaying) {
          playRelayChunk();
        }
        audioEl.play().catch(() => {});
        // TURN 中继模式隐藏音质选择
        document.getElementById('bitrateControl').classList.add('hidden');
      } else {
        // 非 relay 状态下再走 getStats 检测兜底
        detectRelayMode();
      }
    } else if (state === 'failed' || state === 'disconnected') {
      // TURN 模式下中继还在播，忽略 P2P 连接断开
      if (_relayDetected) return;
      // 中继保底在播时也不显示断开提示
      if (relayMode) {
        console.log('[ICE] P2P断开（中继保底中）:', state);
        return;
      }
      console.log('[ICE] P2P断开:', state, 'iceState:', p2pPC.iceConnectionState);
      p2pRemoteStream = null;
      isPlaying = false;
      if (p2pPC) { p2pPC.close(); p2pPC = null; }
      // 清空 p2pPC 后，sender 重发 offer 时 handleWebRTCOffer 会重新创建
      document.getElementById('playHint').textContent = '连接断开，等待重连...';
      setStatus('buffering', '连接断开，重连中...');
    }
  };

  // 消费之前缓存的 ICE candidate——在 setRemoteDescription 之后再添加
  const flushPendingCandidates = () => {
    if (pendingCandidates.length > 0) {
      pendingCandidates.forEach(c => {
        p2pPC.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
      });
      pendingCandidates = [];
    }
  };

  p2pPC.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => {
    flushPendingCandidates();
    return p2pPC.createAnswer();
  }).then(answer => {
    return p2pPC.setLocalDescription(answer);
  }).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-answer', receiverId: myReceiverId, sdp: p2pPC.localDescription.toJSON() }));
    }
  }).catch(() => {
    p2pPC.close();
    p2pPC = null;
  });
}

// --- P2P Playback ---
function startPlayback() {
  if (isPlaying) return;
  if (!p2pRemoteStream) return;

  // 用用户手势激活的 AudioContext 确保音频状态
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  // P2P 实际连通，关闭中继保底，恢复音质控件
  relayMode = false;
  // 清除 P2P 超时保护
  if (window._p2pTimeout) { clearTimeout(window._p2pTimeout); window._p2pTimeout = null; }

  // P2P 模式显示音质选择
  document.getElementById('bitrateControl').classList.remove('hidden');

  const audioEl = document.getElementById('p2pAudio');
  audioEl.srcObject = p2pRemoteStream;
  // 移动端 autoplay 限制：用 AudioContext 创建 GainNode 连接 audio 元素
  // 但 createMediaElementSource 只能调用一次，所以直接用 play() + 重试
  const doPlay = () => {
    const p = audioEl.play();
    if (p) p.catch(() => { setTimeout(doPlay, 300); });
  };
  doPlay();

  isPlaying = true;
  document.getElementById('playHint').textContent = '正在播放';
  setStatus('playing', '正在播放 🎵');
}

function stopPlayback() {
  const audioEl = document.getElementById('p2pAudio');
  // 清理中继
  relayMode = false;
  relayBlobPlaying = false;
  relayDataChunks = [];
  clearTimeout(relayBlobTimer);
  if (audioEl._relayBlobUrl) {
    URL.revokeObjectURL(audioEl._relayBlobUrl);
    audioEl._relayBlobUrl = null;
  }
  if (p2pPC) { p2pPC.close(); p2pPC = null; }
  p2pRemoteStream = null;
  pendingCandidates = [];
  isPlaying = false;
  document.getElementById('playHint').textContent = '已停止';
  setStatus('connected', '已停止');
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot';
  if (state === 'connected') dot.classList.add('connected');
  if (state === 'playing') dot.classList.add('playing');
  if (state === 'buffering') dot.classList.add('buffering');
  if (state === 'error') dot.classList.add('error');
  document.getElementById('statusText').textContent = text;
}
</script>
