<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>音频播放 - Audio Stream Receiver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f; color: #e0e0e0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .container { max-width: 400px; width: 100%; padding: 32px 24px; text-align: center; }
  h1 {
    font-size: 24px; font-weight: 700; margin-bottom: 6px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 28px; font-size: 13px; }
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 24px; padding: 10px 16px;
    background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 13px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #555; transition: background 0.3s;
  }
  .status-dot.connected { background: #4ade80; box-shadow: 0 0 6px #4ade8066; }
  .status-dot.playing { background: #22d3ee; box-shadow: 0 0 6px #22d3ee66; animation: pulse 1.5s infinite; }
  .status-dot.buffering { background: #f59e0b; box-shadow: 0 0 6px #f59e0b66; }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 6px #ef444466; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 28px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; width: 100%;
  }
  .btn:active { transform: scale(0.97); }
  .btn-connect { background: linear-gradient(135deg, #4ade80, #22d3ee); color: #0a0a0f; }
  .btn-connect:hover { opacity: 0.9; }
  .btn-connect:disabled { opacity: 0.4; cursor: not-allowed; }

  .play-btn {
    width: 120px; height: 120px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #4ade80, #22d3ee); color: #0a0a0f;
    font-size: 40px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    margin: 28px auto; box-shadow: 0 0 40px rgba(74, 222, 128, 0.2);
  }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn:active { transform: scale(0.95); }
  .play-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .play-btn.playing {
    background: linear-gradient(135deg, #22d3ee, #667eea);
    box-shadow: 0 0 40px rgba(34, 211, 238, 0.3);
  }


  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .stat-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; }
  .stat-value { font-size: 18px; font-weight: 700; color: #4ade80; }
  .stat-label { font-size: 10px; color: #777; margin-top: 2px; text-transform: uppercase; }

  .hidden { display: none !important; }

  .tip {
    margin-top: 24px; padding: 10px 14px;
    background: rgba(74, 222, 128, 0.08); border-left: 3px solid #4ade80;
    border-radius: 0 8px 8px 0; font-size: 12px; color: #8b9; text-align: left;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎧 Audio Stream</h1>
  <p class="subtitle">手机端播放</p>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">未连接</span>
  </div>

  <!-- Main action area -->
  <div id="actionArea">
    <!-- Will be dynamically populated -->
  </div>

  <!-- Playing area (shown during playback) -->
  <div id="playArea" class="hidden">
    <!-- 二维码让别人扫码同听 -->
    <div class="play-qr-container" id="playQrContainer">
      <div style="background:white; border-radius:12px; padding:12px; display:inline-block;">
        <img id="qrImage" style="width:160px;height:160px; display:block;" alt="QR">
      </div>
      <p style="color:#888; font-size:11px; margin-top:6px;">📱 让朋友扫码一起听</p>
    </div>
    <p style="color:#666; font-size:12px;" id="playHint">等待音频...</p>

    <!-- Hidden audio element for P2P playback -->
    <audio id="p2pAudio" autoplay style="display:none;"></audio>

  </div>

  <div class="tip">💡 点击按钮即可开始收听。请确保手机音量已打开。</div>
</div>

<script>
// --- State ---
let ws = null;
let roomCode = null;
let audioContext = null;
let processor = null;
let isPlaying = false;
let remoteSampleRate = 48000;
let ringBuffer = null;
let bufferWritePos = 0;
let bufferReadPos = 0;
const RING_BUFFER_SIZE = 48000 * 2;
let samplesBuffered = 0;
let playbackStarted = false;
let userActivated = false;
const INITIAL_BUFFER_MS = 80;
let p2pMode = false;
let myReceiverId = null;

// WebRTC
let p2pPC = null;
let p2pRemoteStream = null;
let p2pAudioEl = null;
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

// Store code from URL
let pendingCode = null;

// --- Initialize UI based on URL params ---
const urlParams = new URLSearchParams(window.location.search);
const preCode = urlParams.get('code');

window.addEventListener('DOMContentLoaded', () => {
  const actionArea = document.getElementById('actionArea');
  if (preCode) {
    pendingCode = preCode.toUpperCase();
    actionArea.innerHTML = `
      <button class="btn btn-connect" id="btnActivate" style="font-size:18px; padding:20px;">
        ▶ 点击开始收听
      </button>
      <p style="color:#666; font-size:12px; margin-top:12px;">房间: ${pendingCode}</p>
    `;
    document.getElementById('btnActivate').addEventListener('click', autoJoinAndActivate);
  } else {
    actionArea.innerHTML = `
      <div style="margin-bottom:20px;">
        <input type="text" id="codeInput" placeholder="输入房间码" maxlength="5" autocomplete="off"
          style="width:100%; padding:14px 18px; border:2px solid rgba(255,255,255,0.1); border-radius:12px;
          background:rgba(255,255,255,0.05); color:#e0e0e0; font-size:20px; font-weight:700;
          letter-spacing:6px; text-align:center; text-transform:uppercase; outline:none;">
      </div>
      <button class="btn btn-connect" id="btnJoin" onclick="manualJoin()">连接</button>
    `;
  }
});

// --- Auto-join from QR scan ---
async function autoJoinAndActivate() {
  const btn = document.getElementById('btnActivate');
  btn.disabled = true;
  btn.textContent = '连接中...';

  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }
    userActivated = true;

    // 提前切换到播放界面
    document.getElementById('actionArea').classList.add('hidden');
    document.getElementById('playArea').classList.remove('hidden');
    document.getElementById('playHint').textContent = '连接中...';
    setStatus('buffering', '连接中...');

    await connectWS();
    roomCode = pendingCode;
    document.getElementById('playHint').textContent = '等待音频...';
    ws.send(JSON.stringify({ type: 'join', code: pendingCode }));
  } catch (err) {
    document.getElementById('playHint').textContent = '连接失败，请重试';
    document.getElementById('playHint').style.color = '#fca5a5';
    btn.disabled = false;
    btn.textContent = '▶ 重试';
  }
}

// --- Manual join ---
async function manualJoin() {
  const codeEl = document.getElementById('codeInput');
  const btn = document.getElementById('btnJoin');
  const code = codeEl.value.trim().toUpperCase();
  if (code.length < 4) { alert('请输入有效的房间码'); return; }

  btn.disabled = true;
  btn.textContent = '连接中...';

  try {
    await connectWS();
    roomCode = code;
    ws.send(JSON.stringify({ type: 'join', code }));
  } catch (err) {
    alert('连接服务器失败');
    btn.disabled = false;
    btn.textContent = '连接';
  }
}

// --- WebSocket ---
function connectWS() {
  return new Promise((resolve, reject) => {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);
    ws.binaryType = 'arraybuffer';

    const timeout = setTimeout(() => {
      ws.close();
      reject(new Error('连接超时'));
    }, 8000);

    ws.onopen = () => { clearTimeout(timeout); resolve(); };
    ws.onerror = (e) => { clearTimeout(timeout); reject(new Error('WebSocket 连接失败')); };
    ws.onclose = () => {
      if (playbackStarted) stopPlayback();
      setStatus('error', '连接断开');
    };

    ws.onmessage = (e) => {
      if (e.data instanceof ArrayBuffer) {
        handleAudioData(e.data);
        return;
      }
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handleSignaling(msg);
    };
  });
}

// --- Signaling ---
function handleSignaling(msg) {
  switch (msg.type) {
    case 'joined': {
      myReceiverId = msg.receiverId || ('device-' + Date.now().toString(36));
      document.getElementById('playHint').textContent = '等待音频...';
      setStatus('connected', '已连接，等待音频...');
      // 显示二维码（让别人扫码同听）
      if (msg.qrDataUrl) {
        document.getElementById('qrImage').src = msg.qrDataUrl;
      }
      break;
    }

    case 'audio-meta':
      remoteSampleRate = msg.sampleRate || 48000;
      if (userActivated && audioContext && audioContext.state === 'running') {
        document.getElementById('playHint').textContent = '缓冲中...';
        setStatus('buffering', '缓冲中...');
      } else {
        document.getElementById('playHint').textContent = '点击播放 ▶';
      }
      break;

    case 'peer-disconnected':
      stopPlayback();
      setStatus('error', '发送端已断开');
      break;

    case 'error':
      setStatus('error', '❌ ' + msg.message);
      document.getElementById('playHint').textContent = '❌ ' + msg.message;
      document.getElementById('playHint').style.color = '#fca5a5';
      break;

    case 'webrtc-offer':
      handleWebRTCOffer(msg);
      break;

    case 'webrtc-ice':
      if (p2pPC) {
        p2pPC.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
      }
      break;

    case 'room-config':
      break;
  }
}

// --- WebRTC: Handle incoming offer from sender ---
function handleWebRTCOffer(msg) {
  if (p2pPC) return;

  p2pPC = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  p2pPC.ontrack = (e) => {
    p2pRemoteStream = e.streams[0];
    p2pMode = true;
    if (playbackStarted) {
      stopRelayPlayback();
    }
    startP2PPlayback();
  };

  p2pPC.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-ice', receiverId: myReceiverId, candidate: e.candidate.toJSON() }));
    }
  };

  p2pPC.onconnectionstatechange = () => {
    if (p2pPC.connectionState === 'failed' || p2pPC.connectionState === 'disconnected') {
      p2pRemoteStream = null;
      p2pMode = false;
      if (p2pPC) { p2pPC.close(); p2pPC = null; }
      // P2P 断开，回退中继，继续播放
      if (playbackStarted) {
        document.getElementById('playHint').textContent = '正在播放';
        setStatus('playing', '正在播放 🎵');
      }
    }
  };

  p2pPC.setRemoteDescription(new RTCSessionDescription(msg.sdp)).then(() => {
    return p2pPC.createAnswer();
  }).then(answer => {
    return p2pPC.setLocalDescription(answer);
  }).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-answer', receiverId: myReceiverId, sdp: p2pPC.localDescription.toJSON() }));
    }
  }).catch(() => {
    p2pMode = false;
  });
}

// --- Switch playback to P2P stream ---
function startP2PPlayback() {
  if (!p2pRemoteStream) return;

  const audioEl = document.getElementById('p2pAudio');
  audioEl.srcObject = p2pRemoteStream;
  audioEl.play().catch(() => {});

  isPlaying = true;
  playbackStarted = true;
  document.getElementById('playHint').textContent = '正在播放';
  setStatus('playing', '正在播放 🎵');
}

function stopRelayPlayback() {
  if (processor) { processor.disconnect(); processor = null; }
  ringBuffer = null;
  samplesBuffered = 0;
}

// --- Audio Data Handler (WebSocket relay) ---
function handleAudioData(arrayBuffer) {
  if (p2pMode) return;

  const int16 = new Int16Array(arrayBuffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 32768;
  }

  if (!ringBuffer) {
    ringBuffer = new Float32Array(RING_BUFFER_SIZE);
  }

  for (let i = 0; i < float32.length; i++) {
    ringBuffer[bufferWritePos] = float32[i];
    bufferWritePos = (bufferWritePos + 1) % RING_BUFFER_SIZE;
  }

  samplesBuffered += float32.length;

  if (userActivated && !playbackStarted && audioContext && audioContext.state === 'running') {
    const needed = remoteSampleRate * (INITIAL_BUFFER_MS / 1000);
    if (samplesBuffered >= needed) {
      startPlayback();
    }
  }
}

// --- Playback ---
async function togglePlay() {
  if (!isPlaying) {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: remoteSampleRate });
    }
    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }

    userActivated = true;
    document.getElementById('playHint').textContent = '缓冲中...';
    setStatus('buffering', '缓冲中...');

    const needed = remoteSampleRate * (INITIAL_BUFFER_MS / 1000);
    if (samplesBuffered >= needed) {
      startPlayback();
    }
  } else {
    stopPlayback();
  }
}

function startPlayback() {
  if (playbackStarted) return;

  // 注册页面离开事件：主动通知服务器退出
  window.addEventListener('beforeunload', onLeavePage);
  document.addEventListener('visibilitychange', onVisibilityChange);

  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: remoteSampleRate });
  }
  if (audioContext.state === 'suspended') {
    audioContext.resume().catch(() => {});
  }

  if (audioContext.sampleRate !== remoteSampleRate) {
    const oldCtx = audioContext;
    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: remoteSampleRate });
    oldCtx.close().catch(() => {});
  }

  const bufferSize = 2048;
  processor = audioContext.createScriptProcessor(bufferSize, 1, 1);

  processor.onaudioprocess = (e) => {
    const output = e.outputBuffer.getChannelData(0);

    if (samplesBuffered > 0) {
      const toRead = Math.min(output.length, samplesBuffered);
      for (let i = 0; i < toRead; i++) {
        output[i] = ringBuffer[bufferReadPos];
        bufferReadPos = (bufferReadPos + 1) % RING_BUFFER_SIZE;
      }
      samplesBuffered -= toRead;
      for (let i = toRead; i < output.length; i++) {
        output[i] = 0;
      }
    } else {
      for (let i = 0; i < output.length; i++) {
        output[i] = 0;
      }
    }
  };

  processor.connect(audioContext.destination);

  playbackStarted = true;
  isPlaying = true;

  document.getElementById('playHint').textContent = '正在播放';
  setStatus('playing', '正在播放 🎵');
}

function stopPlayback() {
  if (processor) { processor.disconnect(); processor = null; }
  if (p2pPC) { p2pPC.close(); p2pPC = null; }
  p2pRemoteStream = null;

  playbackStarted = false;
  isPlaying = false;
  p2pMode = false;
  ringBuffer = null;
  bufferWritePos = 0;
  bufferReadPos = 0;
  samplesBuffered = 0;

  document.getElementById('playHint').textContent = '等待音频...';
  setStatus('connected', '已停止');
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot';
  if (state === 'connected') dot.classList.add('connected');
  if (state === 'playing') dot.classList.add('playing');
  if (state === 'buffering') dot.classList.add('buffering');
  if (state === 'error') dot.classList.add('error');
  document.getElementById('statusText').textContent = text;
}

// 页面离开时主动通知服务器
function onLeavePage() {
  if (ws && ws.readyState === 1 && roomCode) {
    ws.send(JSON.stringify({ type: 'leave', code: roomCode }));
  }
}

function onVisibilityChange() {
  if (document.visibilityState === 'hidden') {
    onLeavePage();
  }
}
</script>
</body>
</html>
