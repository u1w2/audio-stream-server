<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>音频流发送端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f; color: #e0e0e0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .container { max-width: 600px; width: 100%; padding: 40px; text-align: center; }
  h1 {
    font-size: 28px; font-weight: 700; margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 24px; padding: 12px 20px;
    background: rgba(255,255,255,0.05); border-radius: 12px; font-size: 14px;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #555; transition: background 0.3s;
  }
  .status-dot.connected { background: #4ade80; box-shadow: 0 0 8px #4ade8066; }
  .status-dot.streaming { background: #f59e0b; box-shadow: 0 0 8px #f59e0b66; animation: pulse 1.5s infinite; }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef444466; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .qr-container {
    margin: 20px auto; display: flex; justify-content: center; padding: 16px;
    background: white; border-radius: 12px; width: fit-content;
  }
  .qr-container img { display: block; width: 200px; height: 200px; }
  .conn-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 20px;
    background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3);
    font-size: 14px; color: #4ade80;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; margin: 6px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-danger { background: #dc2626; color: white; }
  .btn-danger:hover { background: #b91c1c; }
  .hidden { display: none !important; }
  .device-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; margin-bottom: 6px;
    background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 13px;
  }
  .device-item .device-id { color: #aaa; font-family: monospace; }
  .tip {
    margin-top: 20px; padding: 12px 16px;
    background: rgba(102, 126, 234, 0.1); border-left: 3px solid #667eea;
    border-radius: 0 8px 8px 0; font-size: 13px; color: #aab; text-align: left;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 Audio Stream</h1>
  <p class="subtitle">电脑音频 → 手机实时播放</p>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">等待创建房间...</span>
  </div>

  <div class="warn-box hidden" id="warnBox">
    ⚠️ <strong>浏览器安全限制：</strong>当前页面非安全上下文，无法捕获音频。<br><br>
    请改用 <strong>localhost</strong> 访问：<br>
    <a href="#" id="localhostLink"><code id="localhostUrl"></code></a>
  </div>

  <div id="stepCreate">
    <button class="btn btn-primary" id="btnCreate" onclick="createRoom()">创建房间</button>
  </div>

  <div id="stepStreaming" class="hidden">
    <div class="qr-container" id="qrContainer">
      <div style="color:#999; font-size:13px;">生成二维码中...</div>
    </div>

    <div class="conn-badge">
      📱 <span id="connCount"></span> 个设备已连接
    </div>

    <div id="deviceList" style="margin:12px 0; text-align:left;"></div>

    <button class="btn btn-danger" id="btnStop" onclick="stopStreaming()">⏹ 停止推流</button>
  </div>

  <div class="tip" id="tipBox">
    💡 提示：扫码后自动开始推流。弹窗中请<strong>勾选"共享系统音频"</strong>才能捕获电脑声音。
  </div>
</div>

<script>
let ws = null;
let roomCode = null;
let audioStream = null;
let localAudioTrack = null;
let isStreaming = false;
let deviceCounter = 0;
let deviceList = {};
let selectedBitrate = 750000; // 默认无损

// WebRTC
let peerConnections = {};
const ICE_SERVERS = [
  { urls: 'stun:stun.qq.com:3478' },
  { urls: 'stun:stun.aliyun.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'turn:39.101.174.208:3478', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
  { urls: 'turn:39.101.174.208:3478?transport=tcp', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
];

// --- Check secure context ---
function checkSecureContext() {
  const isSecure = window.isSecureContext;
  const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isSecure && !isLocalhost) {
    document.getElementById('warnBox').classList.remove('hidden');
    const localUrl = `http://localhost:${location.port}`;
    document.getElementById('localhostUrl').textContent = localUrl;
    document.getElementById('localhostLink').href = localUrl;
    document.getElementById('btnCreate').disabled = true;
    setStatus('error', '非安全上下文，请用 localhost 访问');
    return false;
  }
  return true;
}
checkSecureContext();

// 当前是否走 TURN（锁 16kbps，保护服务器带宽）
let _onTurnSender = false;
const TURN_BITRATE = 16000;
const P2P_RETRY_INTERVAL_MS = 15000;
const P2P_PROBE_TIMEOUT_MS = 20000;
const P2P_PROBE_FAIL_BACKOFF_MS = 45000;
const TURN_PROBE_TIMEOUT_MS = 20000;
const ICE_DISCONNECTED_GRACE_MS = 2500;
const disconnectTimers = {};
// 调试日志：通过 WebSocket 上报到服务端，公网可 /api/debug/logs/download 下载
function logToServer(text, tag) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({
      type: 'client-log',
      role: 'sender',
      text,
      tag: tag || '',
    }));
  }
  console.log('[Sender] ' + text);
}
function applyBitrateToPC(pc, bitrate) {
  const sender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
  if (!sender) return;
  const params = sender.getParameters();
  if (!params.encodings) params.encodings = [{}];
  params.encodings[0].maxBitrate = bitrate;
  sender.setParameters(params).catch(() => {});
}

function clearDisconnectTimer(deviceId) {
  if (disconnectTimers[deviceId]) {
    clearTimeout(disconnectTimers[deviceId]);
    delete disconnectTimers[deviceId];
  }
}

let _turnRecreateTimer = {};

function scheduleDirectTurnRecreate(deviceId) {
  if (_turnRecreateTimer[deviceId]) return;
  _turnRecreateTimer[deviceId] = setTimeout(() => {
    delete _turnRecreateTimer[deviceId];
    if (!deviceList[deviceId] || !localAudioTrack) return;
    const active = peerConnections[deviceId];
    if (active && (active.iceConnectionState === 'connected' || active.iceConnectionState === 'completed')) {
      return;
    }
    if (active) cleanupPeerConnection(deviceId, true);
    createDirectTurn(deviceId);
  }, 3500);
}

function clearTurnRecreateTimer(deviceId) {
  if (_turnRecreateTimer[deviceId]) {
    clearTimeout(_turnRecreateTimer[deviceId]);
    delete _turnRecreateTimer[deviceId];
  }
}

function handlePeerLost(deviceId, pc) {
  if (pc._intentionalClose || pc._isProbe || pc._isTurnProbe) return;
  if (!deviceList[deviceId] || !localAudioTrack) return;
  if (peerConnections[deviceId] !== pc) return;
  if (!pc._useTURN) {
    restartIceP2P(deviceId);
    return;
  }
  logToServer('TURN 主连接丢失，延迟重建 device=' + deviceId, 'network');
  cleanupPeerConnection(deviceId, true);
  scheduleDirectTurnRecreate(deviceId);
}

function bindIceHandlers(deviceId, pc, useTURN) {
  pc.oniceconnectionstatechange = () => {
    const ice = pc.iceConnectionState;
    logToServer('ice=' + ice + ' useTURN=' + useTURN + ' device=' + deviceId, 'ice');

    if (ice === 'connected' || ice === 'completed') {
      clearDisconnectTimer(deviceId);
      clearConnectWatchdog(deviceId);
      clearIceRestartAnswerTimeout(deviceId);
      clearP2pMediaVerifyTimer(deviceId);
      if (useTURN) {
        cleanupTurnProbeConnection(deviceId);
        updateDeviceMode(deviceId, 'turn');
        enterTurnMode(deviceId, pc);
      } else {
        cleanupTurnProbeConnection(deviceId);
        updateDeviceMode(deviceId, 'connecting');
        verifyMainP2PMedia(deviceId, pc);
      }
    } else if (ice === 'failed') {
      clearDisconnectTimer(deviceId);
      handlePeerLost(deviceId, pc);
    } else if (ice === 'disconnected') {
      clearDisconnectTimer(deviceId);
      const graceMs = useTURN ? 4500 : ICE_DISCONNECTED_GRACE_MS;
      disconnectTimers[deviceId] = setTimeout(() => {
        delete disconnectTimers[deviceId];
        if (peerConnections[deviceId] !== pc) return;
        const current = pc.iceConnectionState;
        if (current === 'disconnected' || current === 'failed') {
          handlePeerLost(deviceId, pc);
        }
      }, graceMs);
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed' && peerConnections[deviceId] === pc) {
      clearDisconnectTimer(deviceId);
      handlePeerLost(deviceId, pc);
    }
  };
}

// 网络变化时重连：TURN 模式探测 P2P，P2P 模式重建 P2P
window.addEventListener('online', () => {
  Object.keys(deviceList).forEach(id => {
    if (_onTurnSender) {
      tryReconnectP2P(id);
    } else {
      restartIceP2P(id);
    }
  });
});

function notifyReceiverMode(deviceId, mode, bitrate) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({
    type: 'connection-status',
    targetReceiverId: deviceId,
    receiverId: deviceId,
    mode,
    bitrate,
  }));
}

function enterTurnMode(deviceId, pc) {
  _onTurnSender = true;
  selectedBitrate = TURN_BITRATE;
  applyBitrateToPC(pc, TURN_BITRATE);
  updateDeviceMode(deviceId, 'turn');
  notifyReceiverMode(deviceId, 'turn', TURN_BITRATE);
  startP2PRetry(deviceId);
  logToServer('TURN 中继已启用，16kbps');
}

function enterP2PMode(deviceId, pc) {
  _p2pRestartCount[deviceId] = 0;
  _iceRestartCount[deviceId] = 0;
  clearP2PFailoverTimer(deviceId);
  clearConnectWatchdog(deviceId);
  _onTurnSender = false;
  selectedBitrate = 750000;
  applyBitrateToPC(pc, 750000);
  clearP2PRetry(deviceId);
  updateDeviceMode(deviceId, 'p2p');
  notifyReceiverMode(deviceId, 'p2p', 750000);
  logToServer('P2P 直连，切断 TURN');
}

// --- WebSocket (signaling only) ---
function connectWS() {
  return new Promise((resolve, reject) => {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    const timeout = setTimeout(() => {
      ws.close();
      reject(new Error('连接超时'));
    }, 5000);

    ws.onopen = () => { clearTimeout(timeout); resolve(); };
    ws.onerror = (e) => { clearTimeout(timeout); reject(e); };
    ws.onclose = () => {
      setStatus('disconnected', '连接断开');
      document.getElementById('btnCreate').disabled = false;
    };

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handleSignaling(msg);
    };
  });
}

async function createRoom() {
  document.getElementById('btnCreate').disabled = true;
  setStatus('connected', '正在请求音频权限...');

  const maxConnections = parseInt(document.getElementById('inputMaxConn')?.value) || 5;

  const audioOk = await requestAudioSource();
  if (!audioOk) {
    document.getElementById('btnCreate').disabled = false;
    return;
  }

  setStatus('connected', '音频已就绪，正在连接...');

  try {
    await connectWS();
    setStatus('connected', '正在创建房间...');
    logToServer('【版本】V6.9-p2p-playback 已加载', 'version');
    ws.send(JSON.stringify({ type: 'create', host: location.host, p2pOnly: true, maxConnections }));
  } catch (err) {
    setStatus('error', '创建失败');
    document.getElementById('btnCreate').disabled = false;
  }
}

function recoverReceiver(deviceId) {
  if (!deviceId || deviceList[deviceId]) return;
  logToServer('恢复 receiver 登记 device=' + deviceId, 'recover');
  registerDevice(deviceId, Object.keys(deviceList).length + 1);
  updateDeviceList();
  if (!isStreaming) {
    isStreaming = true;
    document.getElementById('btnStop').classList.remove('hidden');
  }
  const count = Object.keys(deviceList).length;
  setStatus('streaming', '正在推流 🎵 (' + count + ' 个设备)');
  if (localAudioTrack && !peerConnections[deviceId] && !probeConnections[deviceId] && !turnProbeConnections[deviceId]) {
    startP2P(deviceId);
  }
}

function ensureReceiver(deviceId) {
  if (!deviceId) return false;
  if (!deviceList[deviceId]) recoverReceiver(deviceId);
  return !!deviceList[deviceId];
}

function handleSignaling(msg) {
  switch (msg.type) {
    case 'created':
      roomCode = msg.code;
      document.getElementById('stepCreate').classList.add('hidden');
      document.getElementById('stepStreaming').classList.remove('hidden');
      document.getElementById('tipBox').classList.add('hidden');
      setStatus('connected', '房间已创建，等待手机扫码...');
      Object.keys(_relayRetryTimer).forEach(did => clearP2PRetry(did));

      if (msg.qrDataUrl) {
        document.getElementById('qrContainer').innerHTML =
          `<img src="${msg.qrDataUrl}" alt="QR Code" style="width:200px;height:200px;">`;
      } else {
        document.getElementById('qrContainer').innerHTML =
          `<div style="color:#999; font-size:13px;">二维码生成失败</div>`;
      }
      break;

    case 'peer-ready': {
      const devId = msg.receiverId || ('device-' + (deviceCounter + 1));
      const serverCount = msg.connections || 1;
      const reg = registerDevice(devId, serverCount);
      updateDeviceList();
      if (localAudioTrack) {
        const pc = peerConnections[devId];
        const stalePc = pc && !pc._useTURN && (
          pc.iceConnectionState === 'failed' ||
          pc.iceConnectionState === 'disconnected' ||
          pc.iceConnectionState === 'closed'
        );
        if (reg === 'migrated' || stalePc) {
          logToServer('设备重连/迁移，ICE restart deviceId=' + devId);
          restartIceP2P(devId);
        } else if (!pc && !probeConnections[devId]) {
          startP2P(devId);
        }
      }
      if (!isStreaming) {
        isStreaming = true;
        document.getElementById('btnStop').classList.remove('hidden');
      }
      const count = Object.keys(deviceList).length;
      setStatus('streaming', '正在推流 🎵 (' + count + ' 个设备)');
      break;
    }

    case 'connection-status':
      if (msg.receiverId && deviceList[msg.receiverId]) {
        deviceList[msg.receiverId].mode = msg.mode;
      }
      updateDeviceList();
      break;

    case 'webrtc-answer': {
      if (msg.receiverId && !msg.isProbe && !msg.isTurnProbe) {
        ensureReceiver(msg.receiverId);
      }
      const pc = resolvePC(msg.receiverId, msg.isProbe, msg.isTurnProbe);
      if (pc) {
        clearIceRestartAnswerTimeout(msg.receiverId);
        delete _offerRetryCount[msg.receiverId];
        clearConnectWatchdog(msg.receiverId);
        pc.setRemoteDescription(new RTCSessionDescription(msg.sdp)).catch(() => {});
      }
      break;
    }

    case 'webrtc-ice': {
      const pc = resolvePC(msg.receiverId, msg.isProbe, msg.isTurnProbe);
      if (pc) {
        pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(() => {});
      }
      break;
    }

    case 'peer-left': {
      if (msg.receiverId && deviceList[msg.receiverId]) {
        cleanupProbeConnection(msg.receiverId);
        cleanupTurnProbeConnection(msg.receiverId);
        cleanupPeerConnection(msg.receiverId);
        delete deviceList[msg.receiverId];
      } else {
        const keys = Object.keys(deviceList);
        if (keys.length > 0) {
          cleanupPeerConnection(keys[0]);
          delete deviceList[keys[0]];
        }
      }
      updateDeviceList();
      if (Object.keys(deviceList).length === 0) {
        document.getElementById('btnStop').classList.add('hidden');
        setStatus('connected', '无设备连接，等待扫码...');
      } else {
        const count = Object.keys(deviceList).length;
        setStatus('streaming', '正在推流 🎵 (' + count + ' 个设备)');
      }
      break;
    }

    case 'peer-disconnected':
      Object.keys(probeConnections).forEach(id => cleanupProbeConnection(id));
      Object.keys(turnProbeConnections).forEach(id => cleanupTurnProbeConnection(id));
      Object.keys(peerConnections).forEach(id => cleanupPeerConnection(id));
      deviceList = {};
      deviceCounter = 0;
      updateDeviceList();
      isStreaming = false;
      document.getElementById('btnStop').classList.add('hidden');
      setStatus('connected', '设备已断开，等待重新扫码...');
      break;

    case 'bitrate-change': {
      const br = msg.bitrate;
      if (_onTurnSender) {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'bitrate-change', bitrate: TURN_BITRATE, receiverId: msg.receiverId }));
        }
        break;
      }
      selectedBitrate = br;
      Object.entries(peerConnections).forEach(([id, pc]) => applyBitrateToPC(pc, br));
      console.log(`[Bitrate] Changed to ${br} bps (requested by ${msg.receiverId})`);
      break;
    }

    case 'p2p-check':
      break;

    case 'p2p-no-media':
      if (msg.receiverId && ensureReceiver(msg.receiverId)) {
        handleNetworkChanged(msg.receiverId);
      }
      break;

    case 'network-changed':
      if (msg.receiverId && ensureReceiver(msg.receiverId)) {
        handleNetworkChanged(msg.receiverId);
      }
      break;

    case 'connection-lost':
      if (msg.receiverId && ensureReceiver(msg.receiverId)) {
        if (probeConnections[msg.receiverId]) {
          logToServer('忽略 connection-lost（P2P 并行探测中）', 'network');
          break;
        }
        if (turnProbeConnections[msg.receiverId]) {
          logToServer('忽略 connection-lost（TURN 并行探测中）', 'network');
          break;
        }
        if (_p2pRestarting[msg.receiverId]) {
          logToServer('忽略 connection-lost（P2P 重连中）', 'network');
          break;
        }
        const lostPc = peerConnections[msg.receiverId];
        if (_onTurnSender || (lostPc && lostPc._useTURN)) {
          logToServer('忽略 connection-lost（TURN 模式/重建中）', 'network');
          break;
        }
        logToServer('receiver 报告连接丢失，ICE restart device=' + msg.receiverId, 'network');
        handleNetworkChanged(msg.receiverId);
      }
      break;

    case 'error':
      alert(msg.message);
      break;
  }
}

// --- WebRTC P2P ---

const STUN_SERVERS = [
  { urls: 'stun:stun.qq.com:3478' },
  { urls: 'stun:stun.aliyun.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
];

function turnPcConfig() {
  return { iceServers: ICE_SERVERS, iceTransportPolicy: 'relay' };
}

function resolvePC(deviceId, isProbe, isTurnProbe) {
  if (isTurnProbe) return turnProbeConnections[deviceId];
  if (isProbe) return probeConnections[deviceId];
  return peerConnections[deviceId];
}

function attachAudioTrack(pc) {
  if (localAudioTrack) {
    pc.addTrack(localAudioTrack, audioStream || new MediaStream([localAudioTrack]));
  }
}

function wireIceCandidate(deviceId, pc, flags) {
  pc.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-ice',
        targetReceiverId: deviceId,
        ...flags,
        candidate: e.candidate.toJSON(),
      }));
    }
  };
}

function scheduleBitrate(pc, bitrate) {
  setTimeout(() => applyBitrateToPC(pc, bitrate), 100);
  setTimeout(() => applyBitrateToPC(pc, bitrate), 2000);
}

function createPC(deviceId, useTURN, isProbe) {
  const pc = new RTCPeerConnection(useTURN ? turnPcConfig() : { iceServers: STUN_SERVERS });
  if (isProbe) {
    probeConnections[deviceId] = pc;
    pc._isProbe = true;
  } else {
    peerConnections[deviceId] = pc;
  }

  attachAudioTrack(pc);
  scheduleBitrate(pc, useTURN ? TURN_BITRATE : selectedBitrate);
  wireIceCandidate(deviceId, pc, { isProbe: !!isProbe });

  if (isProbe) {
    bindProbeIceHandlers(deviceId, pc);
  } else {
    bindIceHandlers(deviceId, pc, useTURN);
  }
  pc._useTURN = useTURN;
  return pc;
}

function createTurnProbePC(deviceId) {
  const pc = new RTCPeerConnection(turnPcConfig());
  turnProbeConnections[deviceId] = pc;
  pc._isTurnProbe = true;
  attachAudioTrack(pc);
  scheduleBitrate(pc, TURN_BITRATE);
  wireIceCandidate(deviceId, pc, { isTurnProbe: true });
  bindTurnProbeIceHandlers(deviceId, pc);
  pc._useTURN = true;
  return pc;
}

function sendTurnOffer(deviceId, pc, flags) {
  return pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-offer',
        targetReceiverId: deviceId,
        useTURN: true,
        ...flags,
        sdp: pc.localDescription.toJSON(),
      }));
    }
  });
}

function createDirectTurn(deviceId) {
  if (!deviceList[deviceId] || peerConnections[deviceId]) return;
  if (turnProbeConnections[deviceId]) return;
  clearTurnRecreateTimer(deviceId);
  logToServer('直接建立 TURN deviceId=' + deviceId, 'network');
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'reconnect-relay', targetReceiverId: deviceId }));
  }
  const pc = createPC(deviceId, true, false);
  if (!pc) return;
  sendTurnOffer(deviceId, pc, {}).catch(() => cleanupPeerConnection(deviceId));
}

function upgradeToTurn(deviceId) {
  if (!deviceList[deviceId]) return;
  const mainPc = peerConnections[deviceId];
  if (mainPc && !mainPc._useTURN) {
    startTurnProbe(deviceId);
    return;
  }
  if (mainPc || turnProbeConnections[deviceId]) return;
  createDirectTurn(deviceId);
}

function startP2P(deviceId) {
  if (peerConnections[deviceId]) return;
  const pc = createPC(deviceId, false, false);
  if (!pc) return;

  pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-offer',
        targetReceiverId: deviceId,
        useTURN: false,
        sdp: pc.localDescription.toJSON(),
      }));
    }
    scheduleConnectWatchdog(deviceId);
    scheduleOfferAnswerTimeout(deviceId);
  }).catch(() => cleanupPeerConnection(deviceId));
}

let _p2pRetrying = {};
let probeConnections = {};
let turnProbeConnections = {};
let probeTimeouts = {};
let turnProbeTimeouts = {};
let probeVerifyTimers = {};
let turnProbeVerifyTimers = {};
let probeFailBackoff = {};
let _turnProbeRetrying = {};
let p2pMediaVerifyTimers = {};
let _p2pRestarting = {};
let _p2pRestartCount = {};
let _iceRestartCount = {};
let p2pFailoverTimers = {};
let connectWatchdogTimers = {};
let iceRestartAnswerTimers = {};
let _offerRetryCount = {};

function clearIceRestartAnswerTimeout(deviceId) {
  if (iceRestartAnswerTimers[deviceId]) {
    clearTimeout(iceRestartAnswerTimers[deviceId]);
    delete iceRestartAnswerTimers[deviceId];
  }
}

function scheduleIceRestartAnswerTimeout(deviceId) {
  scheduleOfferAnswerTimeout(deviceId);
}

function scheduleOfferAnswerTimeout(deviceId, isRetry) {
  clearIceRestartAnswerTimeout(deviceId);
  if (!isRetry) delete _offerRetryCount[deviceId];
  const delay = isRetry ? 12000 : 8000;
  iceRestartAnswerTimers[deviceId] = setTimeout(() => {
    delete iceRestartAnswerTimers[deviceId];
    const pc = peerConnections[deviceId];
    if (!pc || pc._p2pVerified) return;
    const ice = pc.iceConnectionState;
    if (ice === 'connected' || ice === 'completed') return;

    if (!_offerRetryCount[deviceId] && deviceList[deviceId]) {
      _offerRetryCount[deviceId] = 1;
      logToServer(
        'offer 无 answer，force-rejoin 重试 deviceId=' + deviceId + ' ice=' + ice,
        'stale'
      );
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'force-rejoin', targetReceiverId: deviceId }));
      }
      scheduleOfferAnswerTimeout(deviceId, true);
      return;
    }

    delete _offerRetryCount[deviceId];
    logToServer('offer 仍无 answer，移除僵尸设备 deviceId=' + deviceId, 'stale');
    removeStaleReceiver(deviceId);
  }, delay);
}

function removeStaleReceiver(deviceId) {
  logToServer('移除僵尸/超时设备 deviceId=' + deviceId, 'stale');
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'force-rejoin', targetReceiverId: deviceId }));
  }
  clearConnectWatchdog(deviceId);
  clearP2PFailoverTimer(deviceId);
  clearIceRestartAnswerTimeout(deviceId);
  clearP2pMediaVerifyTimer(deviceId);
  cleanupTurnProbeConnection(deviceId);
  cleanupProbeConnection(deviceId);
  cleanupPeerConnection(deviceId, true);
  delete deviceList[deviceId];
  delete _iceRestartCount[deviceId];
  delete _p2pRestartCount[deviceId];
  delete _p2pRestarting[deviceId];
  delete _offerRetryCount[deviceId];
  updateDeviceList();
  if (Object.keys(deviceList).length === 0) {
    document.getElementById('btnStop').classList.add('hidden');
    setStatus('connected', '无设备连接，等待扫码...');
  }
}

function clearConnectWatchdog(deviceId) {
  if (connectWatchdogTimers[deviceId]) {
    clearTimeout(connectWatchdogTimers[deviceId]);
    delete connectWatchdogTimers[deviceId];
  }
}

function scheduleConnectWatchdog(deviceId) {
  clearConnectWatchdog(deviceId);
  const pc = peerConnections[deviceId];
  const delay = pc && pc._p2pVerified ? 8000 : 15000;
  connectWatchdogTimers[deviceId] = setTimeout(() => {
    delete connectWatchdogTimers[deviceId];
    const activePc = peerConnections[deviceId];
    if (!activePc || activePc._useTURN || activePc._p2pVerified) return;
    if (_p2pRestarting[deviceId] || iceRestartAnswerTimers[deviceId]) return;
    const ice = activePc.iceConnectionState;
    if (ice === 'connected' || ice === 'completed') return;
    logToServer('P2P 连接超时(' + delay + 'ms)，ICE restart deviceId=' + deviceId, 'watchdog');
    restartIceP2P(deviceId);
  }, delay);
}

function clearP2PFailoverTimer(deviceId) {
  if (p2pFailoverTimers[deviceId]) {
    clearTimeout(p2pFailoverTimers[deviceId]);
    delete p2pFailoverTimers[deviceId];
  }
}

function scheduleP2PFailoverToTurn(deviceId) {
  clearP2PFailoverTimer(deviceId);
  p2pFailoverTimers[deviceId] = setTimeout(() => {
    delete p2pFailoverTimers[deviceId];
    const pc = peerConnections[deviceId];
    if (pc && pc._p2pVerified && !pc._useTURN) return;
    if (turnProbeConnections[deviceId] || probeConnections[deviceId]) return;
    logToServer('P2P 重连未恢复，启动 TURN 探测 deviceId=' + deviceId);
    if (pc && !pc._useTURN) cleanupPeerConnection(deviceId, true);
    startTurnProbe(deviceId);
  }, 8000);
}

async function restartIceP2P(deviceId) {
  if (!deviceList[deviceId] || !localAudioTrack) return;
  if (_p2pRestarting[deviceId]) return;

  const pc = peerConnections[deviceId];
  if (!pc || pc._useTURN) {
    restartP2P(deviceId);
    return;
  }

  _iceRestartCount[deviceId] = (_iceRestartCount[deviceId] || 0) + 1;
  if (_iceRestartCount[deviceId] > 2) {
    _iceRestartCount[deviceId] = 0;
    restartP2P(deviceId);
    return;
  }

  _p2pRestarting[deviceId] = true;
  logToServer('P2P ICE restart deviceId=' + deviceId + ' 第' + _iceRestartCount[deviceId] + '次');
  clearP2pMediaVerifyTimer(deviceId);
  clearConnectWatchdog(deviceId);

  try {
    const fastVerify = !!pc._p2pVerified;
    pc._p2pVerified = false;
    pc._fastVerify = fastVerify;
    const offer = await pc.createOffer({ iceRestart: true });
    await pc.setLocalDescription(offer);
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-offer',
        targetReceiverId: deviceId,
        useTURN: false,
        iceRestart: true,
        sdp: pc.localDescription.toJSON(),
      }));
    }
    scheduleIceRestartAnswerTimeout(deviceId);
    verifyMainP2PMedia(deviceId, pc);
    scheduleP2PFailoverToTurn(deviceId);
    scheduleConnectWatchdog(deviceId);
  } catch (_) {
    logToServer('ICE restart 失败，完整重连 deviceId=' + deviceId);
    restartP2P(deviceId);
  }

  setTimeout(() => { delete _p2pRestarting[deviceId]; }, 3000);
}

function handleNetworkChanged(deviceId) {
  if (!deviceList[deviceId] || !localAudioTrack) return;
  _iceRestartCount[deviceId] = 0;
  _p2pRestartCount[deviceId] = 0;
  delete _p2pRestarting[deviceId];
  clearP2PFailoverTimer(deviceId);
  clearConnectWatchdog(deviceId);
  clearIceRestartAnswerTimeout(deviceId);
  logToServer('receiver 网络切换，ICE restart device=' + deviceId, 'network');
  restartIceP2P(deviceId);
}

function restartP2P(deviceId) {
  if (!deviceList[deviceId] || !localAudioTrack) return;
  if (_p2pRestarting[deviceId]) return;

  const mainPc = peerConnections[deviceId];
  if (mainPc && mainPc._useTURN) return;

  _p2pRestartCount[deviceId] = (_p2pRestartCount[deviceId] || 0) + 1;
  if (_p2pRestartCount[deviceId] > 3) {
    logToServer('P2P 重连次数过多，改 TURN 探测 deviceId=' + deviceId);
    cleanupPeerConnection(deviceId, true);
    startTurnProbe(deviceId);
    return;
  }

  _p2pRestarting[deviceId] = true;
  _iceRestartCount[deviceId] = 0;
  logToServer('P2P 重连 deviceId=' + deviceId + ' 第' + _p2pRestartCount[deviceId] + '次');

  clearP2pMediaVerifyTimer(deviceId);
  cleanupTurnProbeConnection(deviceId);

  if (mainPc) cleanupPeerConnection(deviceId, true);

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'reconnect-p2p', targetReceiverId: deviceId }));
  }

  startP2P(deviceId);
  scheduleP2PFailoverToTurn(deviceId);

  setTimeout(() => { delete _p2pRestarting[deviceId]; }, 5000);
}

function clearP2pMediaVerifyTimer(deviceId) {
  if (p2pMediaVerifyTimers[deviceId]) {
    clearTimeout(p2pMediaVerifyTimers[deviceId]);
    delete p2pMediaVerifyTimers[deviceId];
  }
}

async function verifyMainP2PMedia(deviceId, pc) {
  if (pc._p2pVerified || pc._useTURN) return;
  if (peerConnections[deviceId] !== pc) return;

  let lastBytes = 0;
  let stableCount = 0;
  let checks = 0;
  const needStable = pc._fastVerify ? 1 : 2;
  const maxChecks = pc._fastVerify ? 3 : 4;
  const intervalMs = pc._fastVerify ? 300 : 500;

  const check = async () => {
    if (peerConnections[deviceId] !== pc || pc._useTURN) return;
    const ice = pc.iceConnectionState;
    if (ice !== 'connected' && ice !== 'completed') return;

    checks++;
    try {
      const stats = await pc.getStats();
      let bytes = 0;
      let hasRelay = false;
      stats.forEach(report => {
        if (report.type === 'outbound-rtp' && report.kind === 'audio') {
          bytes = report.bytesSent || 0;
        }
        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
          if (report.localCandidateType === 'relay' || report.remoteCandidateType === 'relay') {
            hasRelay = true;
          }
        }
      });

      if (hasRelay) {
        logToServer('P2P 实际走 relay，启动 TURN 探测');
        startTurnProbe(deviceId);
        return;
      }

      if (bytes > lastBytes) {
        stableCount++;
        lastBytes = bytes;
      }
      if (stableCount >= needStable) {
        pc._p2pVerified = true;
        pc._fastVerify = false;
        updateDeviceMode(deviceId, 'p2p');
        enterP2PMode(deviceId, pc);
        return;
      }
    } catch (_) {}

    if (checks >= maxChecks) {
      logToServer('P2P 无媒体流，ICE restart device=' + deviceId, 'media');
      restartIceP2P(deviceId);
      return;
    }
    p2pMediaVerifyTimers[deviceId] = setTimeout(check, intervalMs);
  };

  check();
}

function clearTurnProbeTimeout(deviceId) {
  if (turnProbeTimeouts[deviceId]) {
    clearTimeout(turnProbeTimeouts[deviceId]);
    delete turnProbeTimeouts[deviceId];
  }
}

function clearTurnProbeVerifyTimer(deviceId) {
  if (turnProbeVerifyTimers[deviceId]) {
    clearTimeout(turnProbeVerifyTimers[deviceId]);
    delete turnProbeVerifyTimers[deviceId];
  }
}

function cleanupTurnProbeConnection(deviceId) {
  clearTurnProbeTimeout(deviceId);
  clearTurnProbeVerifyTimer(deviceId);
  const pc = turnProbeConnections[deviceId];
  if (pc) {
    pc._intentionalClose = true;
    pc.close();
    delete turnProbeConnections[deviceId];
  }
}

function clearProbeTimeout(deviceId) {
  if (probeTimeouts[deviceId]) {
    clearTimeout(probeTimeouts[deviceId]);
    delete probeTimeouts[deviceId];
  }
}

function clearProbeVerifyTimer(deviceId) {
  if (probeVerifyTimers[deviceId]) {
    clearTimeout(probeVerifyTimers[deviceId]);
    delete probeVerifyTimers[deviceId];
  }
}

function cleanupProbeConnection(deviceId) {
  clearProbeTimeout(deviceId);
  clearProbeVerifyTimer(deviceId);
  const pc = probeConnections[deviceId];
  if (pc) {
    pc._intentionalClose = true;
    pc.close();
    delete probeConnections[deviceId];
  }
}

function bindProbeIceHandlers(deviceId, pc) {
  pc.oniceconnectionstatechange = () => {
    const ice = pc.iceConnectionState;
    logToServer('probe ice=' + ice);
    if (ice === 'connected' || ice === 'completed') {
      verifyProbeMedia(deviceId, pc);
    } else if (ice === 'failed') {
      failProbe(deviceId, 'ICE failed');
    }
  };
}

async function verifyProbeMedia(deviceId, pc) {
  if (pc._verifying || pc._verified) return;
  if (probeConnections[deviceId] !== pc) return;
  pc._verifying = true;

  let lastBytes = 0;
  let stableCount = 0;
  let checks = 0;

  const check = async () => {
    if (probeConnections[deviceId] !== pc) return;
    const ice = pc.iceConnectionState;
    if (ice !== 'connected' && ice !== 'completed') {
      pc._verifying = false;
      return;
    }

    checks++;
    try {
      const stats = await pc.getStats();
      let bytes = 0;
      let hasRelay = false;
      stats.forEach(report => {
        if (report.type === 'outbound-rtp' && report.kind === 'audio') {
          bytes = report.bytesSent || 0;
        }
        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
          if (report.localCandidateType === 'relay' || report.remoteCandidateType === 'relay') {
            hasRelay = true;
          }
        }
      });

      if (hasRelay) {
        failProbe(deviceId, 'probe 仍走 relay');
        return;
      }
      if (bytes > lastBytes) {
        stableCount++;
        lastBytes = bytes;
      }
      if (stableCount >= 2) {
        commitProbeSwitch(deviceId, pc);
        return;
      }
    } catch (_) {}

    if (checks >= 8) {
      failProbe(deviceId, 'probe 无媒体流');
      return;
    }
    probeVerifyTimers[deviceId] = setTimeout(check, 1000);
  };

  check();
}

function commitProbeSwitch(deviceId, probePc) {
  if (probeConnections[deviceId] !== probePc || probePc._verified) return;
  probePc._verified = true;
  clearProbeTimeout(deviceId);
  clearProbeVerifyTimer(deviceId);
  logToServer('P2P 探测成功，切换 deviceId=' + deviceId, 'media');

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'p2p-probe-commit', targetReceiverId: deviceId }));
  }

  cleanupPeerConnection(deviceId, true);
  delete probeConnections[deviceId];
  probePc._isProbe = false;
  peerConnections[deviceId] = probePc;
  bindIceHandlers(deviceId, probePc, false);
  enterP2PMode(deviceId, probePc);
}

function failTurnProbe(deviceId, reason) {
  logToServer(reason + ' deviceId=' + deviceId);
  cleanupTurnProbeConnection(deviceId);
  const mainPc = peerConnections[deviceId];
  if (mainPc && !mainPc._useTURN) {
    cleanupPeerConnection(deviceId, true);
  }
  createDirectTurn(deviceId);
}

function bindTurnProbeIceHandlers(deviceId, pc) {
  pc.oniceconnectionstatechange = () => {
    const ice = pc.iceConnectionState;
    logToServer('turn-probe ice=' + ice);
    if (ice === 'connected' || ice === 'completed') {
      verifyTurnProbeMedia(deviceId, pc);
    } else if (ice === 'failed') {
      failTurnProbe(deviceId, 'TURN probe ICE failed');
    }
  };
}

async function verifyTurnProbeMedia(deviceId, pc) {
  if (pc._verifying || pc._verified) return;
  if (turnProbeConnections[deviceId] !== pc) return;
  pc._verifying = true;

  let lastBytes = 0;
  let stableCount = 0;
  let checks = 0;

  const check = async () => {
    if (turnProbeConnections[deviceId] !== pc) return;
    const ice = pc.iceConnectionState;
    if (ice !== 'connected' && ice !== 'completed') {
      pc._verifying = false;
      return;
    }

    checks++;
    try {
      const stats = await pc.getStats();
      let bytes = 0;
      let hasRelay = false;
      stats.forEach(report => {
        if (report.type === 'outbound-rtp' && report.kind === 'audio') {
          bytes = report.bytesSent || 0;
        }
        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
          if (report.localCandidateType === 'relay' || report.remoteCandidateType === 'relay') {
            hasRelay = true;
          }
        }
      });

      if (hasRelay) {
        if (bytes > lastBytes) stableCount++;
        lastBytes = Math.max(lastBytes, bytes);
        if (stableCount >= 2 || checks >= 5) {
          commitTurnProbeSwitch(deviceId, pc);
          return;
        }
        turnProbeVerifyTimers[deviceId] = setTimeout(check, 500);
        return;
      }
      if (!hasRelay) {
        if (checks >= 8) {
          failTurnProbe(deviceId, 'TURN probe 未走 relay');
          return;
        }
        turnProbeVerifyTimers[deviceId] = setTimeout(check, 500);
        return;
      }
    } catch (_) {}

    if (checks >= 10) {
      failTurnProbe(deviceId, 'TURN probe 无媒体流');
      return;
    }
    turnProbeVerifyTimers[deviceId] = setTimeout(check, 500);
  };

  check();
}

function commitTurnProbeSwitch(deviceId, probePc) {
  if (turnProbeConnections[deviceId] !== probePc || probePc._verified) return;
  probePc._verified = true;
  clearTurnProbeTimeout(deviceId);
  clearTurnProbeVerifyTimer(deviceId);
  logToServer('TURN 探测成功，切换 deviceId=' + deviceId);

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'turn-probe-commit', targetReceiverId: deviceId }));
  }

  cleanupPeerConnection(deviceId, true);
  delete turnProbeConnections[deviceId];
  probePc._isTurnProbe = false;
  peerConnections[deviceId] = probePc;
  bindIceHandlers(deviceId, probePc, true);
  enterTurnMode(deviceId, probePc);
}

function startTurnProbe(deviceId) {
  if (!deviceList[deviceId] || !localAudioTrack || _turnProbeRetrying[deviceId]) return;
  const mainPc = peerConnections[deviceId];
  if (mainPc && mainPc._useTURN) return;
  if (turnProbeConnections[deviceId]) return;

  if (!mainPc) {
    createDirectTurn(deviceId);
    return;
  }

  _turnProbeRetrying[deviceId] = true;
  logToServer('并行探测 TURN deviceId=' + deviceId);

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'turn-probe-start', targetReceiverId: deviceId }));
  }

  const probePc = createTurnProbePC(deviceId);
  sendTurnOffer(deviceId, probePc, { isTurnProbe: true })
    .catch(() => failTurnProbe(deviceId, 'TURN probe offer 失败'));

  clearTurnProbeTimeout(deviceId);
  turnProbeTimeouts[deviceId] = setTimeout(() => {
    if (turnProbeConnections[deviceId]) failTurnProbe(deviceId, 'TURN 探测超时');
  }, TURN_PROBE_TIMEOUT_MS);

  setTimeout(() => { delete _turnProbeRetrying[deviceId]; }, 8000);
}

function failProbe(deviceId, reason) {
  logToServer(reason + ' deviceId=' + deviceId);
  cleanupProbeConnection(deviceId);
  probeFailBackoff[deviceId] = Date.now() + P2P_PROBE_FAIL_BACKOFF_MS;
  startP2PRetry(deviceId);
}

function tryReconnectP2P(deviceId) {
  if (!deviceList[deviceId] || !localAudioTrack || _p2pRetrying[deviceId]) return;
  const mainPc = peerConnections[deviceId];
  if (!mainPc || !mainPc._useTURN) return;
  if (probeConnections[deviceId]) return;
  if (probeFailBackoff[deviceId] && Date.now() < probeFailBackoff[deviceId]) return;

  _p2pRetrying[deviceId] = true;
  logToServer('并行探测 P2P deviceId=' + deviceId);

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'p2p-probe-start', targetReceiverId: deviceId }));
  }

  const probePc = createPC(deviceId, false, true);
  probePc.createOffer().then(offer => probePc.setLocalDescription(offer)).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-offer',
        targetReceiverId: deviceId,
        useTURN: false,
        isProbe: true,
        sdp: probePc.localDescription.toJSON(),
      }));
    }
  }).catch(() => failProbe(deviceId, 'probe offer 失败'));

  clearProbeTimeout(deviceId);
  probeTimeouts[deviceId] = setTimeout(() => {
    if (probeConnections[deviceId]) failProbe(deviceId, 'P2P 探测超时');
  }, P2P_PROBE_TIMEOUT_MS);

  setTimeout(() => { delete _p2pRetrying[deviceId]; }, 8000);
}

let _relayRetryTimer = {};

function startP2PRetry(deviceId) {
  clearP2PRetry(deviceId);
  if (!_onTurnSender || !deviceList[deviceId]) return;
  if (probeConnections[deviceId]) return;
  let delay = P2P_RETRY_INTERVAL_MS;
  if (probeFailBackoff[deviceId] && Date.now() < probeFailBackoff[deviceId]) {
    delay = probeFailBackoff[deviceId] - Date.now();
  }
  _relayRetryTimer[deviceId] = setTimeout(() => {
    delete _relayRetryTimer[deviceId];
    if (!_onTurnSender || !deviceList[deviceId]) return;
    tryReconnectP2P(deviceId);
  }, delay);
}

function clearP2PRetry(deviceId) {
  if (_relayRetryTimer[deviceId]) {
    clearTimeout(_relayRetryTimer[deviceId]);
    delete _relayRetryTimer[deviceId];
  }
}

function updateDeviceMode(deviceId, mode) {
  if (deviceList[deviceId]) {
    deviceList[deviceId].mode = mode;
    updateDeviceList();
  }
}

function rekeyDeviceMap(map, oldId, newId) {
  if (map[oldId] !== undefined) {
    map[newId] = map[oldId];
    delete map[oldId];
  }
}

function migrateDeviceId(oldId, newId) {
  if (oldId === newId || !deviceList[oldId]) return;
  logToServer('设备 ID 迁移 ' + oldId + ' -> ' + newId);
  deviceList[newId] = deviceList[oldId];
  delete deviceList[oldId];
  rekeyDeviceMap(peerConnections, oldId, newId);
  rekeyDeviceMap(probeConnections, oldId, newId);
  rekeyDeviceMap(turnProbeConnections, oldId, newId);
  rekeyDeviceMap(disconnectTimers, oldId, newId);
  rekeyDeviceMap(_relayRetryTimer, oldId, newId);
  rekeyDeviceMap(probeTimeouts, oldId, newId);
  rekeyDeviceMap(turnProbeTimeouts, oldId, newId);
  rekeyDeviceMap(probeVerifyTimers, oldId, newId);
  rekeyDeviceMap(turnProbeVerifyTimers, oldId, newId);
  rekeyDeviceMap(probeFailBackoff, oldId, newId);
  rekeyDeviceMap(_p2pRetrying, oldId, newId);
  rekeyDeviceMap(_turnProbeRetrying, oldId, newId);
  rekeyDeviceMap(p2pMediaVerifyTimers, oldId, newId);
  rekeyDeviceMap(_p2pRestarting, oldId, newId);
  rekeyDeviceMap(_p2pRestartCount, oldId, newId);
  rekeyDeviceMap(_iceRestartCount, oldId, newId);
  rekeyDeviceMap(p2pFailoverTimers, oldId, newId);
  rekeyDeviceMap(connectWatchdogTimers, oldId, newId);
  rekeyDeviceMap(iceRestartAnswerTimers, oldId, newId);
  rekeyDeviceMap(_turnRecreateTimer, oldId, newId);
  rekeyDeviceMap(_offerRetryCount, oldId, newId);
}

function registerDevice(devId, serverCount) {
  if (deviceList[devId]) {
    deviceList[devId].mode = deviceList[devId].mode || 'connecting';
    return 'exists';
  }

  const ids = Object.keys(deviceList);
  // 仅一台设备在线但 receiverId 变化（信令重连）：合并为同一设备
  if (serverCount === 1 && ids.length === 1 && ids[0] !== devId) {
    migrateDeviceId(ids[0], devId);
    deviceList[devId].mode = 'connecting';
    return 'migrated';
  }

  // 清理无 WebRTC 连接的僵尸条目
  ids.forEach(oldId => {
    if (oldId !== devId && !peerConnections[oldId] && !probeConnections[oldId]) {
      delete deviceList[oldId];
      clearP2PRetry(oldId);
    }
  });

  if (deviceList[devId]) {
    deviceList[devId].mode = 'connecting';
    return 'exists';
  }

  deviceCounter++;
  deviceList[devId] = { num: deviceCounter, mode: 'connecting' };
  return 'new';
}

function cleanupPeerConnection(deviceId, intentional) {
  clearDisconnectTimer(deviceId);
  clearConnectWatchdog(deviceId);
  clearIceRestartAnswerTimeout(deviceId);
  clearP2pMediaVerifyTimer(deviceId);
  const pc = peerConnections[deviceId];
  if (pc) {
    if (intentional) pc._intentionalClose = true;
    pc.close();
    delete peerConnections[deviceId];
  }
}

// --- 请求音频权限 ---
async function requestAudioSource() {
  if (audioStream && localAudioTrack && localAudioTrack.readyState === 'live') {
    return true;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert('浏览器不支持音频捕获！\n请使用 http://localhost 访问此页面。');
    setStatus('error', '浏览器不支持');
    return false;
  }

  try {
    const displayStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    const audioTracks = displayStream.getAudioTracks();
    if (audioTracks.length === 0) {
      alert('未获取到音频轨道！\n\n请确保在弹窗中：\n1. 勾选了"共享系统音频"\n2. 或选择了一个正在播放音频的标签页');
      displayStream.getTracks().forEach(t => t.stop());
      setStatus('connected', '音频获取失败');
      return false;
    }

    displayStream.getVideoTracks().forEach(t => t.stop());
    audioStream = new MediaStream(audioTracks);
    localAudioTrack = audioStream.getAudioTracks()[0];
    return true;
  } catch (err) {
    if (err.name === 'NotAllowedError') {
      setStatus('connected', '音频权限被拒绝');
    } else {
      alert('获取音频失败: ' + err.message);
      setStatus('error', '音频获取失败');
    }
    return false;
  }
}

// --- UI ---
function updateDeviceList() {
  const container = document.getElementById('deviceList');
  const entries = Object.entries(deviceList);
  if (entries.length === 0) {
    container.innerHTML = '';
  } else {
    container.innerHTML = entries.map(([id, dev]) => {
      return `<div class="device-item">
        <span class="device-id">设备 ${dev.num}</span>
      </div>`;
    }).join('');
  }
  updateConnCount();
}

function updateConnCount() {
  const count = Object.keys(deviceList).length;
  document.getElementById('connCount').textContent = count;
}

function stopStreaming() {
  Object.keys(_relayRetryTimer).forEach(id => clearP2PRetry(id));
  Object.keys(probeConnections).forEach(id => cleanupProbeConnection(id));
  Object.keys(turnProbeConnections).forEach(id => cleanupTurnProbeConnection(id));
  if (audioStream) { audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }
  localAudioTrack = null;
  Object.keys(peerConnections).forEach(id => cleanupPeerConnection(id));
  peerConnections = {};
  deviceList = {};
  deviceCounter = 0;
  isStreaming = false;
  updateDeviceList();
  document.getElementById('btnStop').classList.add('hidden');
  setStatus('connected', '已停止推流');
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot';
  if (state === 'connected') dot.classList.add('connected');
  if (state === 'streaming') dot.classList.add('streaming');
  if (state === 'error') dot.classList.add('error');
  document.getElementById('statusText').textContent = text;
}
</script>
