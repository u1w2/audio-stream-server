<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>音频流发送端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f; color: #e0e0e0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .container { max-width: 600px; width: 100%; padding: 40px; text-align: center; }
  h1 {
    font-size: 28px; font-weight: 700; margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 24px; padding: 12px 20px;
    background: rgba(255,255,255,0.05); border-radius: 12px; font-size: 14px;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #555; transition: background 0.3s;
  }
  .status-dot.connected { background: #4ade80; box-shadow: 0 0 8px #4ade8066; }
  .status-dot.streaming { background: #f59e0b; box-shadow: 0 0 8px #f59e0b66; animation: pulse 1.5s infinite; }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef444466; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .qr-container {
    margin: 20px auto; display: flex; justify-content: center; padding: 16px;
    background: white; border-radius: 12px; width: fit-content;
  }
  .qr-container img { display: block; width: 200px; height: 200px; }
  .conn-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 20px;
    background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3);
    font-size: 14px; color: #4ade80;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; margin: 6px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-danger { background: #dc2626; color: white; }
  .btn-danger:hover { background: #b91c1c; }
  .hidden { display: none !important; }
  .device-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; margin-bottom: 6px;
    background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 13px;
  }
  .device-item .device-id { color: #aaa; font-family: monospace; }
  .tip {
    margin-top: 20px; padding: 12px 16px;
    background: rgba(102, 126, 234, 0.1); border-left: 3px solid #667eea;
    border-radius: 0 8px 8px 0; font-size: 13px; color: #aab; text-align: left;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 Audio Stream</h1>
  <p class="subtitle">电脑音频 → 手机实时播放</p>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">等待创建房间...</span>
  </div>

  <div class="warn-box hidden" id="warnBox">
    ⚠️ <strong>浏览器安全限制：</strong>当前页面非安全上下文，无法捕获音频。<br><br>
    请改用 <strong>localhost</strong> 访问：<br>
    <a href="#" id="localhostLink"><code id="localhostUrl"></code></a>
  </div>

  <div id="stepCreate">
    <button class="btn btn-primary" id="btnCreate" onclick="createRoom()">创建房间</button>
  </div>

  <div id="stepStreaming" class="hidden">
    <div class="qr-container" id="qrContainer">
      <div style="color:#999; font-size:13px;">生成二维码中...</div>
    </div>

    <div class="conn-badge">
      📱 <span id="connCount"></span> 个设备已连接
    </div>

    <div id="deviceList" style="margin:12px 0; text-align:left;"></div>

    <button class="btn btn-danger" id="btnStop" onclick="stopStreaming()">⏹ 停止推流</button>
  </div>

  <div class="tip" id="tipBox">
    💡 提示：扫码后自动开始推流。弹窗中请<strong>勾选"共享系统音频"</strong>才能捕获电脑声音。
  </div>
</div>

<script>
let ws = null;
let roomCode = null;
let audioStream = null;
let localAudioTrack = null;
let isStreaming = false;
let deviceCounter = 0;
let deviceList = {};
let selectedBitrate = 750000; // 默认无损

// WebRTC
let peerConnections = {};
const ICE_SERVERS = [
  { urls: 'stun:stun.qq.com:3478' },
  { urls: 'stun:stun.aliyun.com:3478' },
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'turn:39.101.174.208:3478', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
  { urls: 'turn:39.101.174.208:3478?transport=tcp', username: 'u1w2', credential: 'Mua04xOwvE8uBD4X' },
];

// --- Check secure context ---
function checkSecureContext() {
  const isSecure = window.isSecureContext;
  const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isSecure && !isLocalhost) {
    document.getElementById('warnBox').classList.remove('hidden');
    const localUrl = `http://localhost:${location.port}`;
    document.getElementById('localhostUrl').textContent = localUrl;
    document.getElementById('localhostLink').href = localUrl;
    document.getElementById('btnCreate').disabled = true;
    setStatus('error', '非安全上下文，请用 localhost 访问');
    return false;
  }
  return true;
}
checkSecureContext();

// 当前是否走 TURN（锁 16kbps，保护服务器带宽）
let _onTurnSender = false;
const TURN_BITRATE = 16000;
const P2P_RETRY_INTERVAL_MS = 15000;
const ICE_DISCONNECTED_GRACE_MS = 2500; // disconnected 后等待 ICE 自恢复
const disconnectTimers = {};
// 调试日志：通过 WebSocket 发送到服务端
function logToServer(text) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'sender-log', text }));
  }
  console.log('[Sender] ' + text);
}
function applyBitrateToPC(pc, bitrate) {
  const sender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
  if (!sender) return;
  const params = sender.getParameters();
  if (!params.encodings) params.encodings = [{}];
  params.encodings[0].maxBitrate = bitrate;
  sender.setParameters(params).catch(() => {});
}

function clearDisconnectTimer(deviceId) {
  if (disconnectTimers[deviceId]) {
    clearTimeout(disconnectTimers[deviceId]);
    delete disconnectTimers[deviceId];
  }
}

function handlePeerLost(deviceId, pc) {
  if (!deviceList[deviceId] || !localAudioTrack) return;
  if (peerConnections[deviceId] !== pc) return;
  logToServer('连接丢失 useTURN=' + !!pc._useTURN);
  cleanupPeerConnection(deviceId);
  upgradeToTurn(deviceId);
}

function bindIceHandlers(deviceId, pc, useTURN) {
  pc.oniceconnectionstatechange = () => {
    const ice = pc.iceConnectionState;
    logToServer('ice=' + ice + ' useTURN=' + useTURN);

    if (ice === 'connected' || ice === 'completed') {
      clearDisconnectTimer(deviceId);
      updateDeviceMode(deviceId, useTURN ? 'turn' : 'p2p');
      if (useTURN) {
        enterTurnMode(deviceId, pc);
      } else {
        enterP2PMode(deviceId, pc);
      }
    } else if (ice === 'failed') {
      clearDisconnectTimer(deviceId);
      handlePeerLost(deviceId, pc);
    } else if (ice === 'disconnected') {
      clearDisconnectTimer(deviceId);
      disconnectTimers[deviceId] = setTimeout(() => {
        delete disconnectTimers[deviceId];
        if (peerConnections[deviceId] !== pc) return;
        const current = pc.iceConnectionState;
        if (current === 'disconnected' || current === 'failed') {
          handlePeerLost(deviceId, pc);
        }
      }, ICE_DISCONNECTED_GRACE_MS);
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed' && peerConnections[deviceId] === pc) {
      clearDisconnectTimer(deviceId);
      handlePeerLost(deviceId, pc);
    }
  };
}

// 网络恢复时自动探测 P2P（TURN 模式下）
window.addEventListener('online', () => {
  if (!_onTurnSender) return;
  Object.keys(deviceList).forEach(id => tryReconnectP2P(id));
});

function notifyReceiverMode(deviceId, mode, bitrate) {
  if (!ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({
    type: 'connection-status',
    targetReceiverId: deviceId,
    receiverId: deviceId,
    mode,
    bitrate,
  }));
}

function enterTurnMode(deviceId, pc) {
  _onTurnSender = true;
  selectedBitrate = TURN_BITRATE;
  applyBitrateToPC(pc, TURN_BITRATE);
  updateDeviceMode(deviceId, 'turn');
  notifyReceiverMode(deviceId, 'turn', TURN_BITRATE);
  startP2PRetry(deviceId);
  logToServer('TURN 中继已启用，16kbps');
}

function enterP2PMode(deviceId, pc) {
  _onTurnSender = false;
  selectedBitrate = 750000;
  applyBitrateToPC(pc, 750000);
  clearP2PRetry(deviceId);
  updateDeviceMode(deviceId, 'p2p');
  notifyReceiverMode(deviceId, 'p2p', 750000);
  logToServer('P2P 直连，切断 TURN');
}

// --- WebSocket (signaling only) ---
function connectWS() {
  return new Promise((resolve, reject) => {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    const timeout = setTimeout(() => {
      ws.close();
      reject(new Error('连接超时'));
    }, 5000);

    ws.onopen = () => { clearTimeout(timeout); resolve(); };
    ws.onerror = (e) => { clearTimeout(timeout); reject(e); };
    ws.onclose = () => {
      setStatus('disconnected', '连接断开');
      document.getElementById('btnCreate').disabled = false;
    };

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handleSignaling(msg);
    };
  });
}

async function createRoom() {
  document.getElementById('btnCreate').disabled = true;
  setStatus('connected', '正在请求音频权限...');

  const maxConnections = parseInt(document.getElementById('inputMaxConn')?.value) || 5;

  const audioOk = await requestAudioSource();
  if (!audioOk) {
    document.getElementById('btnCreate').disabled = false;
    return;
  }

  setStatus('connected', '音频已就绪，正在连接...');

  try {
    await connectWS();
    setStatus('connected', '正在创建房间...');
    logToServer('【版本】V3-event-driven 已加载');
    ws.send(JSON.stringify({ type: 'create', host: location.host, p2pOnly: true, maxConnections }));
  } catch (err) {
    setStatus('error', '创建失败');
    document.getElementById('btnCreate').disabled = false;
  }
}

function handleSignaling(msg) {
  switch (msg.type) {
    case 'created':
      roomCode = msg.code;
      document.getElementById('stepCreate').classList.add('hidden');
      document.getElementById('stepStreaming').classList.remove('hidden');
      document.getElementById('tipBox').classList.add('hidden');
      setStatus('connected', '房间已创建，等待手机扫码...');
      Object.keys(_relayRetryTimer).forEach(did => clearP2PRetry(did));

      if (msg.qrDataUrl) {
        document.getElementById('qrContainer').innerHTML =
          `<img src="${msg.qrDataUrl}" alt="QR Code" style="width:200px;height:200px;">`;
      } else {
        document.getElementById('qrContainer').innerHTML =
          `<div style="color:#999; font-size:13px;">二维码生成失败</div>`;
      }
      break;

    case 'peer-ready': {
      const devId = msg.receiverId || ('device-' + (deviceCounter + 1));
      deviceCounter++;
      deviceList[devId] = { num: deviceCounter, mode: 'connecting' };
      updateDeviceList();
      // P2P: 建连接发音频
      if (localAudioTrack) {
        startP2P(devId);
      }
      if (!isStreaming) {
        isStreaming = true;
        document.getElementById('btnStop').classList.remove('hidden');
      }
      const count = Object.keys(deviceList).length;
      setStatus('streaming', '正在推流 🎵 (' + count + ' 个设备)');
      break;
    }

    case 'connection-status':
      if (msg.receiverId && deviceList[msg.receiverId]) {
        deviceList[msg.receiverId].mode = msg.mode;
      }
      updateDeviceList();
      break;

    case 'webrtc-answer':
      if (msg.receiverId && peerConnections[msg.receiverId]) {
        peerConnections[msg.receiverId].setRemoteDescription(new RTCSessionDescription(msg.sdp))
          .catch(() => {});
      }
      break;

    case 'webrtc-ice':
      if (msg.receiverId && peerConnections[msg.receiverId]) {
        peerConnections[msg.receiverId].addIceCandidate(new RTCIceCandidate(msg.candidate))
          .catch(() => {});
      }
      break;

    case 'peer-left': {
      if (msg.receiverId && deviceList[msg.receiverId]) {
        cleanupPeerConnection(msg.receiverId);
        delete deviceList[msg.receiverId];
      } else {
        const keys = Object.keys(deviceList);
        if (keys.length > 0) {
          cleanupPeerConnection(keys[0]);
          delete deviceList[keys[0]];
        }
      }
      updateDeviceList();
      if (Object.keys(deviceList).length === 0) {
        document.getElementById('btnStop').classList.add('hidden');
        setStatus('connected', '无设备连接，等待扫码...');
      } else {
        const count = Object.keys(deviceList).length;
        setStatus('streaming', '正在推流 🎵 (' + count + ' 个设备)');
      }
      break;
    }

    case 'peer-disconnected':
      Object.keys(peerConnections).forEach(id => cleanupPeerConnection(id));
      deviceList = {};
      deviceCounter = 0;
      updateDeviceList();
      isStreaming = false;
      document.getElementById('btnStop').classList.add('hidden');
      setStatus('connected', '设备已断开，等待重新扫码...');
      break;

    case 'bitrate-change': {
      const br = msg.bitrate;
      if (_onTurnSender) {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'bitrate-change', bitrate: TURN_BITRATE, receiverId: msg.receiverId }));
        }
        break;
      }
      selectedBitrate = br;
      Object.entries(peerConnections).forEach(([id, pc]) => applyBitrateToPC(pc, br));
      console.log(`[Bitrate] Changed to ${br} bps (requested by ${msg.receiverId})`);
      break;
    }

    case 'p2p-check':
      break;

    case 'connection-lost':
      if (msg.receiverId && deviceList[msg.receiverId]) {
        logToServer('receiver 报告连接丢失');
        const pc = peerConnections[msg.receiverId];
        if (pc) cleanupPeerConnection(msg.receiverId);
        upgradeToTurn(msg.receiverId);
      }
      break;

    case 'error':
      alert(msg.message);
      break;
  }
}

// --- WebRTC P2P ---

function createPC(deviceId, useTURN) {
  const servers = useTURN ? ICE_SERVERS : [{ urls: 'stun:stun.qq.com:3478' }, { urls: 'stun:stun.aliyun.com:3478' }, { urls: 'stun:stun.l.google.com:19302' }];
  const pc = new RTCPeerConnection({ iceServers: servers });
  peerConnections[deviceId] = pc;

  // 添加音频轨道
  if (localAudioTrack) {
    pc.addTrack(localAudioTrack, audioStream || new MediaStream([localAudioTrack]));
  }

  const initialBitrate = useTURN ? TURN_BITRATE : selectedBitrate;
  setTimeout(() => applyBitrateToPC(pc, initialBitrate), 100);
  setTimeout(() => applyBitrateToPC(pc, initialBitrate), 2000);

  pc.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-ice', targetReceiverId: deviceId, candidate: e.candidate.toJSON() }));
    }
  };

  bindIceHandlers(deviceId, pc, useTURN);
  pc._useTURN = useTURN;
  return pc;
}

function upgradeToTurn(deviceId) {
  if (!deviceList[deviceId] || peerConnections[deviceId]) return;
  logToServer('升级 TURN deviceId=' + deviceId);
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'reconnect-relay', targetReceiverId: deviceId }));
  }
  const pc = createPC(deviceId, true);
  if (!pc) return;
  pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: 'webrtc-offer',
        targetReceiverId: deviceId,
        useTURN: true,
        sdp: pc.localDescription.toJSON(),
      }));
    }
  }).catch(() => cleanupPeerConnection(deviceId));
}

function startP2P(deviceId, fromRetry) {
  if (peerConnections[deviceId]) return;
  const pc = createPC(deviceId, false);
  if (!pc) return;
  pc._fromRetry = !!fromRetry;

  pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-offer', targetReceiverId: deviceId, useTURN: false, sdp: pc.localDescription.toJSON() }));
    }
  }).catch(() => cleanupPeerConnection(deviceId));
}

let _p2pRetrying = {};

function tryReconnectP2P(deviceId) {
  if (!deviceList[deviceId] || !localAudioTrack || _p2pRetrying[deviceId]) return;
  _p2pRetrying[deviceId] = true;
  logToServer('探测 P2P deviceId=' + deviceId);
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'reconnect-p2p', targetReceiverId: deviceId }));
  }
  if (peerConnections[deviceId]) cleanupPeerConnection(deviceId);
  startP2P(deviceId, true);
  setTimeout(() => { delete _p2pRetrying[deviceId]; }, 8000);
}

let _relayRetryTimer = {};

function startP2PRetry(deviceId) {
  clearP2PRetry(deviceId);
  if (!_onTurnSender || !deviceList[deviceId]) return;
  _relayRetryTimer[deviceId] = setTimeout(() => {
    delete _relayRetryTimer[deviceId];
    if (!_onTurnSender || !deviceList[deviceId]) return;
    tryReconnectP2P(deviceId);
  }, P2P_RETRY_INTERVAL_MS);
}

function clearP2PRetry(deviceId) {
  if (_relayRetryTimer[deviceId]) {
    clearTimeout(_relayRetryTimer[deviceId]);
    delete _relayRetryTimer[deviceId];
  }
}

function updateDeviceMode(deviceId, mode) {
  if (deviceList[deviceId]) {
    deviceList[deviceId].mode = mode;
    updateDeviceList();
  }
}

function cleanupPeerConnection(deviceId) {
  clearDisconnectTimer(deviceId);
  const pc = peerConnections[deviceId];
  if (pc) {
    pc.close();
    delete peerConnections[deviceId];
  }
}

// --- 请求音频权限 ---
async function requestAudioSource() {
  if (audioStream && localAudioTrack && localAudioTrack.readyState === 'live') {
    return true;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert('浏览器不支持音频捕获！\n请使用 http://localhost 访问此页面。');
    setStatus('error', '浏览器不支持');
    return false;
  }

  try {
    const displayStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    const audioTracks = displayStream.getAudioTracks();
    if (audioTracks.length === 0) {
      alert('未获取到音频轨道！\n\n请确保在弹窗中：\n1. 勾选了"共享系统音频"\n2. 或选择了一个正在播放音频的标签页');
      displayStream.getTracks().forEach(t => t.stop());
      setStatus('connected', '音频获取失败');
      return false;
    }

    displayStream.getVideoTracks().forEach(t => t.stop());
    audioStream = new MediaStream(audioTracks);
    localAudioTrack = audioStream.getAudioTracks()[0];
    return true;
  } catch (err) {
    if (err.name === 'NotAllowedError') {
      setStatus('connected', '音频权限被拒绝');
    } else {
      alert('获取音频失败: ' + err.message);
      setStatus('error', '音频获取失败');
    }
    return false;
  }
}

// --- UI ---
function updateDeviceList() {
  const container = document.getElementById('deviceList');
  const entries = Object.entries(deviceList);
  if (entries.length === 0) {
    container.innerHTML = '';
  } else {
    container.innerHTML = entries.map(([id, dev]) => {
      return `<div class="device-item">
        <span class="device-id">设备 ${dev.num}</span>
      </div>`;
    }).join('');
  }
  updateConnCount();
}

function updateConnCount() {
  const count = Object.keys(deviceList).length;
  document.getElementById('connCount').textContent = count;
}

function stopStreaming() {
  Object.keys(_relayRetryTimer).forEach(id => clearP2PRetry(id));
  if (audioStream) { audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }
  localAudioTrack = null;
  Object.keys(peerConnections).forEach(id => cleanupPeerConnection(id));
  peerConnections = {};
  deviceList = {};
  deviceCounter = 0;
  isStreaming = false;
  updateDeviceList();
  document.getElementById('btnStop').classList.add('hidden');
  setStatus('connected', '已停止推流');
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot';
  if (state === 'connected') dot.classList.add('connected');
  if (state === 'streaming') dot.classList.add('streaming');
  if (state === 'error') dot.classList.add('error');
  document.getElementById('statusText').textContent = text;
}
</script>
</body>
</html>
