<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频流发送端 - Audio Stream Sender</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f; color: #e0e0e0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .container { max-width: 600px; width: 100%; padding: 40px; text-align: center; }
  h1 {
    font-size: 28px; font-weight: 700; margin-bottom: 8px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 24px; padding: 12px 20px;
    background: rgba(255,255,255,0.05); border-radius: 12px; font-size: 14px;
  }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #555; transition: background 0.3s;
  }
  .status-dot.connected { background: #4ade80; box-shadow: 0 0 8px #4ade8066; }
  .status-dot.streaming { background: #f59e0b; box-shadow: 0 0 8px #f59e0b66; animation: pulse 1.5s infinite; }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef444466; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .room-code {
    font-size: 48px; font-weight: 800; letter-spacing: 12px; color: #667eea;
    margin: 16px 0; font-family: 'Courier New', monospace;
  }
  .qr-container {
    margin: 20px auto; display: inline-block; padding: 16px;
    background: white; border-radius: 12px;
  }
  .qr-container img { display: block; width: 200px; height: 200px; }
  .receiver-url {
    margin-top: 12px; padding: 8px 12px;
    background: rgba(255,255,255,0.05); border-radius: 8px;
    font-size: 11px; color: #888; word-break: break-all;
    font-family: monospace; cursor: pointer;
  }
  .receiver-url:hover { background: rgba(255,255,255,0.08); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 28px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; margin: 6px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-danger { background: #dc2626; color: white; }
  .btn-danger:hover { background: #b91c1c; }
  .conn-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 20px;
    background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3);
    font-size: 14px; color: #4ade80; margin: 12px 0;
  }
  .volume-meter {
    margin: 16px 0; padding: 16px;
    background: rgba(255,255,255,0.03); border-radius: 12px;
  }
  .volume-bar-container {
    height: 8px; background: rgba(255,255,255,0.1);
    border-radius: 4px; overflow: hidden; margin-top: 8px;
  }
  .volume-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4ade80, #f59e0b, #ef4444);
    border-radius: 4px; transition: width 0.05s;
  }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .stat-item {
    background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; text-align: center;
  }
  .stat-value { font-size: 20px; font-weight: 700; color: #667eea; }
  .stat-label { font-size: 11px; color: #777; margin-top: 4px; text-transform: uppercase; }
  .hidden { display: none !important; }
  .warn-box {
    margin: 20px 0; padding: 16px 20px;
    background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 12px; text-align: left; font-size: 14px; color: #fca5a5;
  }
  .warn-box a { color: #667eea; text-decoration: underline; }
  .warn-box code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .tip {
    margin-top: 20px; padding: 12px 16px;
    background: rgba(102, 126, 234, 0.1); border-left: 3px solid #667eea;
    border-radius: 0 8px 8px 0; font-size: 13px; color: #aab; text-align: left;
  }

  .device-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; margin-bottom: 6px;
    background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 13px;
  }
  .device-item .device-id { color: #aaa; font-family: monospace; }
  .device-item .device-status {
    padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;
  }
  .device-status.p2p { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
  .device-status.relay { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
  .device-status.connecting { background: rgba(102, 126, 234, 0.15); color: #667eea; }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 Audio Stream</h1>
  <p class="subtitle">电脑音频 → 手机实时播放</p>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">等待创建房间...</span>
  </div>

  <!-- Secure context warning -->
  <div class="warn-box hidden" id="warnBox">
    ⚠️ <strong>浏览器安全限制：</strong>当前页面非安全上下文，无法捕获音频。<br><br>
    请改用 <strong>localhost</strong> 访问：<br>
    <a href="#" id="localhostLink"><code id="localhostUrl"></code></a>
  </div>

  <!-- Step 1: Create room -->
  <div id="stepCreate">
    <div style="margin-bottom:16px; text-align:left;">
      <label style="display:flex; align-items:center; gap:8px; padding:10px 14px;
        background:rgba(255,255,255,0.03); border-radius:10px; cursor:pointer;">
        <input type="checkbox" id="chkP2POnly" style="width:18px;height:18px;accent-color:#667eea;">
        <span style="font-size:14px;">仅允许 P2P 连接（内网用户）</span>
      </label>
      <div style="display:flex; align-items:center; gap:8px; margin-top:8px; padding:10px 14px;
        background:rgba(255,255,255,0.03); border-radius:10px;">
        <span style="font-size:14px; color:#aaa; white-space:nowrap;">最大连接数</span>
        <input type="number" id="inputMaxConn" value="5" min="1" max="20"
          style="width:60px; padding:6px 8px; border:1px solid rgba(255,255,255,0.15); border-radius:6px;
          background:rgba(255,255,255,0.05); color:#e0e0e0; font-size:14px; text-align:center; outline:none;">
        <span style="font-size:12px; color:#666;">(1-20)</span>
      </div>
    </div>
    <button class="btn btn-primary" id="btnCreate" onclick="createRoom()">创建房间</button>
  </div>

  <!-- Step 2: Show code & QR, streaming info -->
  <div id="stepStreaming" class="hidden">
    <p style="color:#aaa; font-size:14px;">房间码</p>
    <div class="room-code" id="roomCode"></div>
    <div class="qr-container" id="qrContainer">
      <div style="color:#999; font-size:13px;">生成二维码中...</div>
    </div>
    <div class="receiver-url" id="receiverUrl" onclick="copyUrl()" title="点击复制">加载中...</div>

    <div class="conn-badge" id="connBadge">
      📱 <span id="connCount">0</span> 个设备已连接
    </div>

    <div id="deviceList" style="margin:12px 0; text-align:left;">
    </div>

    <div class="volume-meter" id="volumeMeter">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:13px; color:#aaa;">音量</span>
        <span style="font-size:12px; color:#667eea;" id="volumeText">0%</span>
      </div>
      <div class="volume-bar-container">
        <div class="volume-bar" id="volumeBar"></div>
      </div>
    </div>

    <button class="btn btn-danger" id="btnStop" onclick="stopStreaming()">⏹ 停止推流</button>

  </div>

  <div class="tip" id="tipBox">
    💡 提示：扫码后自动开始推流。弹窗中请<strong>勾选"共享系统音频"</strong>才能捕获电脑声音。
  </div>
</div>

<script>
let ws = null;
let roomCode = null;
let receiverUrl = '';
let audioStream = null;
let localAudioCtx = null;
let meterCtx = null;
let analyser = null;
let volumeAnimFrame = null;
let processor = null;
let sourceNode = null;
let silentGain = null;
let streamStartTime = 0;
let durationInterval = null;
let isStreaming = false;
let relayEnabled = true;
let deviceCounter = 0;
let deviceList = {}; // { deviceId: { num, mode } }

// WebRTC
let peerConnections = {}; // { deviceId: RTCPeerConnection }
let localAudioTrack = null;
const P2P_TIMEOUT = 10000; // 10s fallback to relay
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

// --- Check secure context ---
function checkSecureContext() {
  const isSecure = window.isSecureContext;
  const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!isSecure && !isLocalhost) {
    document.getElementById('warnBox').classList.remove('hidden');
    const localUrl = `http://localhost:${location.port}`;
    document.getElementById('localhostUrl').textContent = localUrl;
    document.getElementById('localhostLink').href = localUrl;
    document.getElementById('btnCreate').disabled = true;
    setStatus('error', '非安全上下文，请用 localhost 访问');
    return false;
  }
  return true;
}
checkSecureContext();

// --- WebSocket ---
function connectWS() {
  return new Promise((resolve, reject) => {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);
    ws.binaryType = 'arraybuffer';

    const timeout = setTimeout(() => {
      ws.close();
      reject(new Error('连接超时'));
    }, 5000);

    ws.onopen = () => { clearTimeout(timeout); resolve(); };
    ws.onerror = (e) => { clearTimeout(timeout); reject(e); };
    ws.onclose = () => { setStatus('disconnected', '连接断开'); };

    ws.onmessage = (e) => {
      if (e.data instanceof ArrayBuffer) return;
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handleSignaling(msg);
    };
  });
}

async function createRoom() {
  document.getElementById('btnCreate').disabled = true;
  setStatus('connected', '正在请求音频权限...');

  const p2pOnly = document.getElementById('chkP2POnly').checked;
  const maxConnections = parseInt(document.getElementById('inputMaxConn').value) || 5;

  // 先获取音频（弹系统窗口），再创建房间
  const audioOk = await requestAudioSource();
  if (!audioOk) {
    document.getElementById('btnCreate').disabled = false;
    return;
  }

  setStatus('connected', '音频已就绪，正在连接...');

  try {
    await connectWS();
    setStatus('connected', '正在创建房间...');
    ws.send(JSON.stringify({ type: 'create', host: location.host, p2pOnly, maxConnections }));
  } catch (err) {
    setStatus('error', '创建失败');
    document.getElementById('btnCreate').disabled = false;
  }
}

function handleSignaling(msg) {
  switch (msg.type) {
    case 'created':
      roomCode = msg.code;
      receiverUrl = msg.receiverUrl || '';
      document.getElementById('roomCode').textContent = roomCode;
      document.getElementById('stepCreate').classList.add('hidden');
      document.getElementById('stepStreaming').classList.remove('hidden');
      setStatus('connected', '房间已创建，等待手机扫码...');

      if (msg.qrDataUrl) {
        document.getElementById('qrContainer').innerHTML =
          `<img src="${msg.qrDataUrl}" alt="QR Code" style="width:200px;height:200px;">`;
      } else {
        document.getElementById('qrContainer').innerHTML =
          `<div style="color:#999; font-size:13px;">二维码生成失败</div>`;
      }
      if (receiverUrl) {
        document.getElementById('receiverUrl').textContent = receiverUrl;
      }
      break;

    case 'peer-ready':
      document.getElementById('connCount').textContent = msg.connections || 1;
      // Add a new device entry with stable ID matching receiver
      const devId = 'device-' + (msg.receiverIndex || (deviceCounter + 1));
      deviceCounter++;
      deviceList[devId] = { num: deviceCounter, mode: 'connecting' };
      updateDeviceList();
      // Start WebRTC P2P attempt
      if (localAudioTrack) {
        startP2P(devId);
      }
      if (!isStreaming) {
        setStatus('streaming', '设备已连接，正在启动推流（中继）...');
        // 如果 audioStream 还在但管线停了，重启管线
        if (audioStream && localAudioTrack && localAudioTrack.readyState === 'live') {
          autoStartStreaming();
        } else {
          autoStartStreaming(); // 没有流的话内部会重新请求
        }
      } else {
        // 已有推流管线，确保中继开启（P2P 可能还没连上）
        relayEnabled = true;
        if (localAudioCtx) {
          ws.send(JSON.stringify({
            type: 'audio-meta',
            sampleRate: localAudioCtx.sampleRate,
            channels: 1
          }));
        }
        setStatus('streaming', '正在推流 🎵 (' + (msg.connections || 1) + ' 个设备)');
      }
      break;

    case 'connection-status':
      if (msg.receiverId && deviceList[msg.receiverId]) {
        deviceList[msg.receiverId].mode = msg.mode;
      }
      updateDeviceList();
      break;

    case 'webrtc-answer':
      if (msg.receiverId && peerConnections[msg.receiverId]) {
        peerConnections[msg.receiverId].setRemoteDescription(new RTCSessionDescription(msg.sdp))
          .catch(() => {});
      }
      break;

    case 'webrtc-ice':
      if (msg.receiverId && peerConnections[msg.receiverId]) {
        peerConnections[msg.receiverId].addIceCandidate(new RTCIceCandidate(msg.candidate))
          .catch(() => {});
      }
      break;

    case 'peer-left':
      document.getElementById('connCount').textContent = msg.connections || 0;
      // Remove the correct device from list
      if (msg.receiverId && deviceList[msg.receiverId]) {
        cleanupPeerConnection(msg.receiverId);
        delete deviceList[msg.receiverId];
        updateDeviceList();
      }
      if (msg.connections === 0) {
        // 所有人断开，只停管线，保留 audioStream
        if (processor) { processor.disconnect(); processor = null; }
        if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
        if (silentGain) { silentGain.disconnect(); silentGain = null; }
        if (localAudioCtx) { localAudioCtx.close().catch(() => {}); localAudioCtx = null; }
        if (meterCtx) { meterCtx.close().catch(() => {}); meterCtx = null; }
        if (volumeAnimFrame) { cancelAnimationFrame(volumeAnimFrame); volumeAnimFrame = null; }
        if (durationInterval) { clearInterval(durationInterval); durationInterval = null; }
        analyser = null;
        isStreaming = false;
        document.getElementById('volumeBar').style.width = '0%';
        document.getElementById('volumeText').textContent = '0%';
        document.getElementById('btnStop').classList.add('hidden');
        setStatus('connected', '所有设备已断开，等待重新扫码...');
      }
      break;

    case 'peer-disconnected':
      // 只清理连接，不停止音频流（保留 audioStream 供下次扫码复用）
      if (processor) { processor.disconnect(); processor = null; }
      if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
      if (silentGain) { silentGain.disconnect(); silentGain = null; }
      if (localAudioCtx) { localAudioCtx.close().catch(() => {}); localAudioCtx = null; }
      if (meterCtx) { meterCtx.close().catch(() => {}); meterCtx = null; }
      if (volumeAnimFrame) { cancelAnimationFrame(volumeAnimFrame); volumeAnimFrame = null; }
      if (durationInterval) { clearInterval(durationInterval); durationInterval = null; }
      analyser = null;
      isStreaming = false;
      relayEnabled = true;
      // 清理所有 WebRTC 连接
      Object.keys(peerConnections).forEach(id => cleanupPeerConnection(id));
      deviceList = {};
      deviceCounter = 0;
      updateDeviceList();
      document.getElementById('volumeBar').style.width = '0%';
      document.getElementById('volumeText').textContent = '0%';
      document.getElementById('btnStop').classList.add('hidden');
      setStatus('connected', '设备已断开，等待重新扫码...');
      break;

    case 'error':
      alert(msg.message);
      break;
  }
}

function copyUrl() {
  if (receiverUrl) {
    navigator.clipboard.writeText(receiverUrl).then(() => alert('链接已复制！')).catch(() => {});
  }
}

function updateDeviceList() {
  const container = document.getElementById('deviceList');
  const entries = Object.entries(deviceList);
  if (entries.length === 0) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = entries.map(([id, dev]) => {
    const modeLabel = dev.mode === 'p2p' ? 'P2P 直连' : dev.mode === 'relay' ? '服务器中继' : '连接中...';
    const modeClass = dev.mode;
    return `<div class="device-item">
      <span class="device-id">设备 ${dev.num}</span>
      <span class="device-status ${modeClass}">${modeLabel}</span>
    </div>`;
  }).join('');
}

// --- WebRTC P2P ---
let p2pCtx = null;
let p2pDest = null;

function ensureP2PAudioSource() {
  // 每次重建 p2pCtx/p2pDest，确保 track 状态新鲜
  // 但只保留一个实例以避免 Chrome 限制
  if (p2pCtx) {
    try { p2pCtx.close().catch(() => {}); } catch (_) {}
  }
  p2pCtx = null;
  p2pDest = null;
  if (!audioStream) return false;
  try {
    p2pCtx = new AudioContext();
    p2pDest = p2pCtx.createMediaStreamDestination();
    const p2pSource = p2pCtx.createMediaStreamSource(audioStream);
    p2pSource.connect(p2pDest);
    return true;
  } catch (_) {
    return false;
  }
}

function startP2P(deviceId) {
  if (peerConnections[deviceId]) return;

  // 确保 P2P 音频源有效
  ensureP2PAudioSource();

  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  peerConnections[deviceId] = pc;

  if (p2pDest) {
    const webrtcTrack = p2pDest.stream.getAudioTracks()[0];
    if (webrtcTrack) {
      pc.addTrack(webrtcTrack, p2pDest.stream);
    }
  } else if (localAudioTrack) {
    pc.addTrack(localAudioTrack, audioStream || new MediaStream([localAudioTrack]));
  }

  // ICE candidate -> server -> receiver
  pc.onicecandidate = (e) => {
    if (e.candidate && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-ice', targetReceiverId: deviceId, candidate: e.candidate.toJSON() }));
    }
  };

  // Connection state
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected' || pc.connectionState === 'completed') {
      updateDeviceMode(deviceId, 'p2p');
      // P2P 成功，关闭此设备的中继
      updateRelayState();
    } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      updateDeviceMode(deviceId, 'relay');
      // P2P 失败，确保此设备走中继
      relayEnabled = true;
      updateRelayState();
      cleanupPeerConnection(deviceId);
    }
  };

  // Create offer
  pc.createOffer().then(offer => {
    return pc.setLocalDescription(offer);
  }).then(() => {
    if (ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'webrtc-offer', targetReceiverId: deviceId, sdp: pc.localDescription.toJSON() }));
    }
    // Fallback: if P2P doesn't connect in time, use relay
    setTimeout(() => {
      if (deviceList[deviceId] && deviceList[deviceId].mode === 'connecting') {
        updateDeviceMode(deviceId, 'relay');
        updateRelayState();
        cleanupPeerConnection(deviceId);
      }
    }, P2P_TIMEOUT);
  }).catch(() => {
    updateDeviceMode(deviceId, 'relay');
    updateRelayState();
  });
}

function updateDeviceMode(deviceId, mode) {
  if (deviceList[deviceId]) {
    deviceList[deviceId].mode = mode;
    updateDeviceList();
  }
}

function updateRelayState() {
  // 中继关闭条件：所有设备都已成功 P2P
  // 中继开启条件：至少一个设备是 relay 状态
  const entries = Object.values(deviceList);
  if (entries.length === 0) return;
  const allP2P = entries.every(d => d.mode === 'p2p');
  const anyRelay = entries.some(d => d.mode === 'relay' || d.mode === 'connecting');
  if (allP2P) {
    relayEnabled = false;
  } else if (anyRelay) {
    relayEnabled = true;
  }
}

function cleanupPeerConnection(deviceId) {
  const pc = peerConnections[deviceId];
  if (pc) {
    pc.close();
    delete peerConnections[deviceId];
  }
}

// --- 提前请求音频权限（创建房间前调用） ---
async function requestAudioSource() {
  // 已有音频流则直接复用，不再弹窗
  if (audioStream && localAudioTrack && localAudioTrack.readyState === 'live') {
    return true;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert('浏览器不支持音频捕获！\\n请使用 http://localhost 访问此页面。');
    setStatus('error', '浏览器不支持');
    return false;
  }

  try {
    const displayStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    const audioTracks = displayStream.getAudioTracks();
    if (audioTracks.length === 0) {
      alert('未获取到音频轨道！\\n\\n请确保在弹窗中：\\n1. 勾选了"共享系统音频"\\n2. 或选择了一个正在播放音频的标签页');
      displayStream.getTracks().forEach(t => t.stop());
      setStatus('connected', '音频获取失败');
      return false;
    }

    displayStream.getVideoTracks().forEach(t => t.stop());
    audioStream = new MediaStream(audioTracks);
    localAudioTrack = audioStream.getAudioTracks()[0];
    return true;
  } catch (err) {
    if (err.name === 'NotAllowedError') {
      setStatus('connected', '音频权限被拒绝');
    } else {
      alert('获取音频失败: ' + err.message);
      setStatus('error', '音频获取失败');
    }
    return false;
  }
}
// --- 开始推流（音频已就绪，直接建立管线） ---
async function autoStartStreaming() {
  if (!audioStream) {
    // 兜底：音频还没准备好重新请求
    const ok = await requestAudioSource();
    if (!ok) return;
  }

  try {
    // AudioContext
    localAudioCtx = new AudioContext();
    const sampleRate = localAudioCtx.sampleRate;

    // Send metadata
    ws.send(JSON.stringify({ type: 'audio-meta', sampleRate, channels: 1 }));

    // Audio pipeline
    sourceNode = localAudioCtx.createMediaStreamSource(audioStream);
    processor = localAudioCtx.createScriptProcessor(2048, 1, 1);
    silentGain = localAudioCtx.createGain();
    silentGain.gain.value = 0;

    sourceNode.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(localAudioCtx.destination);

    // Volume meter (separate context to avoid gain=0)
    meterCtx = new AudioContext();
    const meterSource = meterCtx.createMediaStreamSource(audioStream);
    analyser = meterCtx.createAnalyser();
    analyser.fftSize = 256;
    meterSource.connect(analyser);
    updateVolume();

    streamStartTime = Date.now();
    relayEnabled = true;

    processor.onaudioprocess = (e) => {
      if (ws.readyState !== 1) return;
      if (!relayEnabled) return; // Skip relay when all receivers are P2P
      const inputData = e.inputBuffer.getChannelData(0);
      const int16Data = new Int16Array(inputData.length);
      for (let i = 0; i < inputData.length; i++) {
        const s = Math.max(-1, Math.min(1, inputData[i]));
        int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      try {
        ws.send(int16Data.buffer);
    };

    isStreaming = true;
    document.getElementById('btnStop').classList.remove('hidden');
    const conns = document.getElementById('connCount').textContent;
    setStatus('streaming', '正在推流 🎵 (' + conns + ' 个设备)');

    // Duration counter
    durationInterval = setInterval(() => {
      const elapsed = Math.round((Date.now() - streamStartTime) / 1000);
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
    }, 1000);

  } catch (err) {
    if (err.name === 'NotAllowedError') {
      setStatus('connected', '音频权限被拒绝，等待设备重新连接...');
    } else {
      alert('启动失败: ' + err.message);
      setStatus('error', '推流失败');
    }
  }
}

function stopStreaming() {
  if (processor) { processor.disconnect(); processor = null; }
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (silentGain) { silentGain.disconnect(); silentGain = null; }
  if (audioStream) { audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }
  if (localAudioCtx) { localAudioCtx.close().catch(() => {}); localAudioCtx = null; }
  if (meterCtx) { meterCtx.close().catch(() => {}); meterCtx = null; }
  if (volumeAnimFrame) { cancelAnimationFrame(volumeAnimFrame); volumeAnimFrame = null; }
  if (durationInterval) { clearInterval(durationInterval); durationInterval = null; }
  analyser = null;
  isStreaming = false;
  relayEnabled = true;
  localAudioTrack = null;

  // 清理 P2P 共用 AudioContext
  if (p2pCtx) { p2pCtx.close().catch(() => {}); p2pCtx = null; p2pDest = null; }

  // Cleanup all WebRTC peer connections
  Object.keys(peerConnections).forEach(id => cleanupPeerConnection(id));

  document.getElementById('volumeBar').style.width = '0%';
  document.getElementById('volumeText').textContent = '0%';
  document.getElementById('btnStop').classList.add('hidden');
  setStatus('connected', '已停止推流');
}

function updateVolume() {
  if (!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const avg = data.reduce((a, b) => a + b, 0) / data.length;
  const pct = Math.min(100, (avg / 128) * 100);
  document.getElementById('volumeBar').style.width = pct + '%';
  document.getElementById('volumeText').textContent = Math.round(pct) + '%';
  volumeAnimFrame = requestAnimationFrame(updateVolume);
}


function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot';
  if (state === 'connected') dot.classList.add('connected');
  if (state === 'streaming') dot.classList.add('streaming');
  if (state === 'error') dot.classList.add('error');
  document.getElementById('statusText').textContent = text;
}
</script>
